async function renderReviews() {
    const [reviews, repliedIds] = await Promise.all([
        api('/admin/reviews'),
        // 已回复集合单独拉：评论表本身不带回复信息，这样后台列表也能一次性标出「已回复」
        api('/admin/reviews/replied-ids').catch(() => [])
    ]);
    const repliedSet = new Set(repliedIds || []);
    window.__revFilter = window.__revFilter || 'all';
    const filter = window.__revFilter;
    const filtered = filter === 'all' ? reviews
        : filter === 'pending' ? reviews.filter(r => !r.aiSentiment)
        : filter === 'unreplied' ? reviews.filter(r => !repliedSet.has(r.id))
        : reviews.filter(r => r.aiSentiment === filter);

    const summary = reviews.reduce((acc, r) => {
        acc.total++;
        const s = r.aiSentiment || '未分析';
        acc.bySentiment[s] = (acc.bySentiment[s] || 0) + 1;
        if (r.aiUrgency === '紧急') acc.urgent++;
        return acc;
    }, { total: 0, bySentiment: {}, urgent: 0 });

    const filterBtns = [['all','全部'],['pending','未分析'],['unreplied','待商家回复'],['正面','正面'],['中性','中性'],['负面','负面'],['投诉','投诉']]
        .map(([k, label]) => `<button class="btn ${filter===k?'primary':'ghost'} sm" onclick="filterReviews('${k}')">${label}</button>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="toolbar">
            <div style="display:flex;gap:8px;flex-wrap:wrap">${filterBtns}</div>
            ${hasRole('ADMIN') ? '<button class="btn primary" onclick="batchAnalyzeReviews()">⚡ 批量 AI 分析</button>' : ''}
            <div class="spacer"></div>
            <div style="color:var(--muted-foreground);font-size:12px">
                共 ${reviews.length} 条 · 紧急 ${summary.urgent} 条 · 未分析 ${summary.bySentiment['未分析']||0} 条
            </div>
        </div>
        ${renderPanel(headWith('评论管理'), tableWrap(`
            <colgroup>
                <col style="width:4%"><col style="width:6%"><col style="width:6.5%">
                <col style="width:6%"><col style="width:6%"><col style="width:6%">
                <col style="width:17%"><col style="width:15.5%"><col style="width:7%">
                <col style="width:8%"><col style="width:18%">
            </colgroup>
            <thead><tr><th>ID</th><th>商品</th><th>用户</th><th>评分</th><th>情感</th><th>紧急度</th><th>内容</th><th>AI 理由</th><th>商家回复</th><th>时间</th><th>操作</th></tr></thead>
            <tbody>${filtered.map(r => {
                const sBadge = r.aiSentiment ? statusBadge(r.aiSentiment, SENTIMENT_BADGE) : '<span class="badge gray">未分析</span>';
                const uBadge = r.aiUrgency   ? statusBadge(r.aiUrgency,   URGENCY_BADGE)   : '<span class="badge gray">—</span>';
                const content = r.content || '';
                const reason = r.aiReason || '';
                // 时间竖排成「日期 / 时分秒」两行，省下近一半列宽还不撑高行（见下方 .cell-meta）
                const tsRaw = fmtTime(r.createdAt);
                const tsSp = tsRaw.indexOf(' ');
                const tsDate = tsSp > 0 ? tsRaw.substring(0, tsSp) : tsRaw;
                const tsClock = tsSp > 0 ? tsRaw.substring(tsSp + 1) : '';
                const replied = repliedSet.has(r.id);
                const replyBadge = replied
                    ? '<span class="badge green">已回复</span>'
                    : '<span class="badge gray">待回复</span>';
                return `<tr>
                    <td>${r.id}</td>
                    <td>${r.productId}</td>
                    <td>${esc(r.userName || '-')}</td>
                    <td><span class="badge ${r.rating >= 4 ? 'green' : r.rating >= 3 ? 'orange' : 'red'}">${r.rating} 星</span></td>
                    <td>${sBadge}</td>
                    <td>${uBadge}</td>
                    <td class="wraptext"><div class="clamp-2" title="${esc(content)}">${content ? esc(content) : '—'}</div></td>
                    <td class="cell-reason"><div class="clamp-2" title="${esc(reason)}">${reason ? esc(reason) : '—'}</div></td>
                    <td>${replyBadge}</td>
                    <td><div>${tsDate}</div>${tsClock ? `<span class="cell-meta">${tsClock}</span>` : ''}</td>
                    <td>
                        <div class="ops">
                            <button class="btn ${replied ? 'ghost' : 'primary'} sm" onclick="replyReview(${r.id})" title="以商家身份回复">${replied ? '再回复' : '回复'}</button>
                            ${hasRole('ADMIN') ? `<button class="btn ghost sm" onclick="analyzeReview(${r.id})" title="AI 分析">🧠</button>` : ''}
                            ${hasRole('ADMIN') ? `<button class="btn ghost sm" onclick="draftReply(${r.id})" title="AI 起回复">✏️</button>` : ''}
                            <button class="btn ghost sm" onclick="viewReviewDetail(${r.id})" title="查看详情">👁</button>
                            <button class="btn danger sm" onclick="delReview(${r.id})">删除</button>
                        </div>
                    </td>
                </tr>`;
            }).join('') || '<tr><td colspan="11" class="empty">暂无评论</td></tr>'}</tbody>`, 'reviews-table'))}
    `;

    window.filterReviews = k => { window.__revFilter = k; renderReviews(); };
    window.analyzeReview = async id => {
        try {
            const data = await api('/admin/ai/reviews/' + id + '/analyze', 'POST');
            toast('分析完成：' + data.sentiment + ' / ' + data.urgency);
            renderReviews();
        } catch (e) { toast(e.message, true); }
    };
    window.batchAnalyzeReviews = async () => {
        if (!confirm('对所有「未分析」评论执行 AI 情感分析（最多 30 条）？')) return;
        const btn = event.target; btn.disabled = true; btn.textContent = '⏳ 分析中…';
        try {
            const data = await api('/admin/ai/reviews/batch-analyze', 'POST');
            btn.disabled = false; btn.textContent = '⚡ 批量 AI 分析';
            toast('本次已分析 ' + data.count + ' 条');
            renderReviews();
        } catch (e) { btn.disabled = false; btn.textContent = '⚡ 批量 AI 分析'; toast(e.message, true); }
    };
    window.draftReply = async id => {
        try {
            toast('正在生成回复草稿…');
            const data = await api('/admin/ai/reviews/' + id + '/draft-reply', 'POST');
            {
                const drafts = data.drafts || [];
                // 记住草稿：点「回复」时自动预填第一条，省一次复制粘贴
                window.__draftsByReview = window.__draftsByReview || {};
                window.__draftsByReview[id] = drafts;
                let body;
                if (drafts.length === 0) {
                    body = '（无草稿）';
                } else {
                    const blocks = drafts.map((d, i) => `
                        <div class="form-row" style="align-items:flex-start">
                            <label>草稿 ${i+1}</label>
                            <div style="flex:1;display:flex;gap:10px;align-items:flex-start">
                                <textarea readonly style="flex:1;min-height:90px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-100);font-family:inherit">${esc(d)}</textarea>
                                <button class="btn ghost sm" data-copy-idx="${i}">📋 复制</button>
                            </div>
                        </div>`).join('');
                    body = `<p class="hint" style="margin-bottom:14px">关闭本窗口后点列表里的「回复」，草稿会自动填入回复框，微调即可发布。</p>${blocks}`;
                }
                openModal('✏️ AI 客服回复草稿', body, () => closeModal(), true, '关闭', '');
                document.querySelectorAll('[data-copy-idx]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.getAttribute('data-copy-idx'), 10);
                        const text = drafts[idx] || '';
                        navigator.clipboard.writeText(text).then(
                            () => toast('已复制'),
                            () => toast('复制失败，请手动选取', true)
                        );
                    });
                });
            }
        } catch (e) { toast(e.message, true); }
    };
    window.viewReviewDetail = async id => {
        const r = reviews.find(x => x.id === id);
        if (!r) return;
        const sBadge = r.aiSentiment ? statusBadge(r.aiSentiment, SENTIMENT_BADGE) : '<span class="badge gray">未分析</span>';
        const uBadge = r.aiUrgency   ? statusBadge(r.aiUrgency,   URGENCY_BADGE)   : '<span class="badge gray">—</span>';
        const html = `
            <div class="form-row"><label>用户</label><div>${esc(r.userName||'-')} · 评论ID ${r.id}</div></div>
            <div class="form-row"><label>评分</label><div><span class="badge ${r.rating>=4?'green':r.rating>=3?'orange':'red'}">${r.rating} 星</span></div></div>
            <div class="form-row" style="align-items:flex-start"><label>评论</label><div style="white-space:normal">${esc(r.content||'')}</div></div>
            <div class="form-row"><label>情感分析</label><div>${sBadge} ${esc(r.aiReason||'')}</div></div>
            <div class="form-row"><label>紧急度</label><div>${uBadge}</div></div>
            <div class="form-row"><label>分析时间</label><div class="text-muted">${fmtTime(r.aiAnalyzedAt) || '—'}</div></div>
            <div class="form-row" style="align-items:flex-start"><label>回复记录</label><div id="revReplies" style="flex:1;white-space:normal">加载中…</div></div>
        `;
        openModal('评论详情 #' + r.id, html, () => closeModal(), true, '关闭', '');
        // 回复单独异步拉：一条评论可能有多条「用户追评」和「商家回复」，按时间顺序展示
        try {
            const replies = await api('/admin/reviews/' + id + '/replies');
            const box = document.getElementById('revReplies');
            if (!box) return;
            box.innerHTML = (replies && replies.length)
                ? replies.map(reviewReplyHtml).join('')
                : '<span class="text-muted">暂无回复</span>';
        } catch (e) {
            const box = document.getElementById('revReplies');
            if (box) box.innerHTML = `<span class="text-muted">加载失败：${esc(e.message)}</span>`;
        }
    };

    /**
     * 商家回复：把运营写的内容作为「商家回复」发布到该评论下，前台商品详情页的评论里
     * 会以「商家回复」标签展示（与用户自己的「追评」区分开）。
     */
    window.replyReview = async id => {
        const r = reviews.find(x => x.id === id);
        const drafts = (window.__draftsByReview || {})[id] || [];
        const prefill = drafts.length ? esc(drafts[0]) : '';
        const body = `
            <div class="form-row"><label>用户</label><div>${esc((r && r.userName) || '-')} · 评论ID ${id}</div></div>
            <div class="form-row" style="align-items:flex-start"><label>用户评价</label><div style="white-space:normal">${esc((r && r.content) || '')}</div></div>
            <div class="form-row" style="align-items:flex-start"><label>商家回复</label>
                <div style="flex:1">
                    <textarea id="revReplyText" style="width:100%;min-height:110px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-50);font-family:inherit;font-size:13px;color:var(--foreground);line-height:1.5;resize:vertical" placeholder="以商家身份回复该评价，会显示在商品详情页评论区…">${prefill}</textarea>
                    <div class="hint" style="margin-top:6px">
                        ${drafts.length ? '已自动填入刚才生成的 AI 草稿，可直接修改。' : '可先用列表里的「✏️ AI 起回复」生成草稿，再回到这里发布。'}
                    </div>
                </div>
            </div>`;
        openModal('回复评论 #' + id, body, async () => {
            const el = document.getElementById('revReplyText');
            const text = ((el && el.value) || '').trim();
            if (!text) throw new Error('回复内容不能为空');
            await api('/admin/reviews/' + id + '/reply', 'POST', { content: text });
            toast('商家回复已发布');
            renderReviews();
        }, false, '发布回复', '取消');
    };
    window.delReview = async id => {
        if (!confirm('删除该评论及其追评？')) return;
        await api('/admin/reviews/' + id, 'DELETE'); toast('已删除'); switchMod('reviews');
    };
}

// ==================== 客服管理 ====================
// 会话列表 + 消息流两栏：左侧选客户，右侧查看「客户提问 / AI 自动回复 / 人工回复」的完整对话，
// 并可直接以人工客服身份回复。AI 自动回复由后端调用大模型生成，这里只做展示与人工介入。
const CS_STATUS = { AI:['AI 应答','blue'], HUMAN:['人工跟进','orange'], CLOSED:['已结束','gray'] };

let csConvCache = [];
let csActiveId = null;
let csTimer = null;

/** 后台侧边栏的客服未读红点（进入客服管理页会清零）。 */
async function refreshCsUnread() {
    const badge = document.getElementById('csUnreadBadge');
    if (!badge || !hasPerm('cs:manage')) return;
    try {
        const s = await api('/admin/cs/stats');
        const n = (s && s.unread) || 0;
        badge.textContent = n;
        badge.style.display = n > 0 ? 'inline-block' : 'none';
    } catch (e) {
        // 静默：红点失败不该打扰使用
    }
}

function csMsgHtml(m) {
    const mine = !!(m.fromCustomer || m.sender === 'USER');
    const isAgent = m.sender === 'AGENT';
    const cls = mine ? 'user' : (isAgent ? 'agent' : 'ai');
    const label = mine ? (m.senderName || '客户')
        : isAgent ? (m.senderName || '人工客服') : 'AI 客服';
    const avatar = mine ? '客' : (isAgent ? '人' : 'AI');
    return `<div class="cs-row${mine ? ' me' : ''}">
        <div class="cs-avatar ${cls}">${avatar}</div>
        <div class="cs-bubble-wrap">
            <div class="cs-meta">${esc(label)} · ${fmtTime(m.createdAt)}</div>
            <div class="cs-bubble">${esc(m.content || '')}</div>
        </div>
    </div>`;
}

function csConvHtml(c) {
    const active = c.id === csActiveId ? ' active' : '';
    const unread = (c.unread || 0) > 0 ? `<span class="cs-unread">${c.unread}</span>` : '';
    return `<div class="cs-conv${active}" onclick="csSelect(${c.id})">
        <div class="cs-conv-top">
            <span class="cs-conv-name">${esc(c.userName || ('用户 ' + c.userId))}</span>
            ${statusBadge(c.status, CS_STATUS)}
            ${unread}
            <span class="cs-conv-time">${esc((c.lastMessageAt || '').substring(5, 16))}</span>
        </div>
        <div class="cs-conv-last">${esc(c.lastMessage || '（暂无消息）')}</div>
    </div>`;
}

/** 只刷新两栏内容，不动输入框（轮询时用户可能正在打字）。 */
async function csRefresh(keepScroll = true) {
    let convs, msgs = [];
    try {
        convs = await api('/admin/cs/conversations');
    } catch (e) {
        return;
    }
    csConvCache = convs || [];
    if (!csConvCache.some(c => c.id === csActiveId)) {
        csActiveId = csConvCache.length ? csConvCache[0].id : null;
    }
    const listBox = document.getElementById('csConvList');
    if (listBox) {
        listBox.innerHTML = csConvCache.length
            ? csConvCache.map(csConvHtml).join('')
            : '<div class="cs-empty">还没有客户发起会话</div>';
    }
    const headBox = document.getElementById('csChatHead');
    const bodyBox = document.getElementById('csChatBody');
    if (!bodyBox) return;

    const active = csConvCache.find(c => c.id === csActiveId);
    if (!active) {
        if (headBox) headBox.innerHTML = '<span class="hint">从左侧选择一个客户会话</span>';
        bodyBox.innerHTML = '<div class="cs-empty">暂无会话</div>';
        refreshCsUnread();
        return;
    }
    try {
        msgs = await api('/admin/cs/conversations/' + active.id + '/messages');
    } catch (e) {
        bodyBox.innerHTML = `<div class="cs-empty">加载失败：${esc(e.message)}</div>`;
        return;
    }
    if (headBox) {
        headBox.innerHTML = `
            <span class="cs-conv-name">${esc(active.userName || ('用户 ' + active.userId))}</span>
            ${statusBadge(active.status, CS_STATUS)}
            <span class="hint">会话 #${active.id} · 共 ${msgs.length} 条消息</span>
            <div class="spacer"></div>
            <button class="btn ghost sm" onclick="csHandBack()" title="交还给 AI 自动应答">🤖 交还 AI</button>`;
    }
    const prevScroll = bodyBox.scrollTop;
    bodyBox.innerHTML = msgs.length
        ? msgs.map(csMsgHtml).join('')
        : '<div class="cs-empty">该客户还没有发过消息</div>';
    if (keepScroll) {
        // 贴在底部看最新消息；用户手动上翻时不强拉回底部
        const nearBottom = prevScroll + bodyBox.clientHeight >= bodyBox.scrollHeight - 60;
        bodyBox.scrollTop = nearBottom ? bodyBox.scrollHeight : prevScroll;
    } else {
        bodyBox.scrollTop = bodyBox.scrollHeight;
    }
    refreshCsUnread();
}

async function renderCs() {
    if (csTimer) { clearInterval(csTimer); csTimer = null; }
    document.getElementById('content').innerHTML = `
        <div class="panel" style="margin-bottom:16px">
            <div class="panel-body">
                <div class="hint">左侧选择客户，可查看该客户与 <b>AI 客服</b> 的完整对话；在下方输入框回复即以 <b>人工客服</b> 身份发送给客户。</div>
            </div>
        </div>
        <div class="cs-layout">
            <div class="panel">
                <div class="panel-head"><h3>客户会话</h3></div>
                <div class="panel-body"><div class="cs-conv-list" id="csConvList"><div class="cs-empty">加载中…</div></div></div>
            </div>
            <div class="cs-chat">
                <div class="cs-chat-head" id="csChatHead"><span class="hint">加载中…</span></div>
                <div class="cs-chat-body" id="csChatBody"><div class="cs-empty">加载中…</div></div>
                <div class="cs-chat-foot">
                    <textarea id="csReplyInput" rows="2" placeholder="以人工客服身份回复该客户…（Ctrl/⌘ + Enter 发送）"></textarea>
                    <button class="btn primary" id="csReplyBtn">发送</button>
                </div>
            </div>
        </div>`;

    document.getElementById('csReplyBtn').onclick = csSendReply;
    document.getElementById('csReplyInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            csSendReply();
        }
    });

    await csRefresh(false);
    // 轮询新消息：客户那边随时可能发消息过来，运营不用手动刷新
    csTimer = setInterval(() => csRefresh(true), 5000);
}

window.csSelect = async id => {
    csActiveId = id;
    await csRefresh(false);
};

window.csSendReply = async () => {
    const input = document.getElementById('csReplyInput');
    const btn = document.getElementById('csReplyBtn');
    const text = (input.value || '').trim();
    if (!text) { toast('请输入回复内容', true); return; }
    if (!csActiveId) { toast('请先选择一个客户会话', true); return; }
    btn.disabled = true;
    btn.textContent = '发送中…';
    try {
        await api('/admin/cs/conversations/' + csActiveId + '/reply', 'POST', { content: text });
        input.value = '';
        toast('已发送给客户');
        await csRefresh(false);
    } catch (e) {
        toast(e.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = '发送';
    }
};

window.csHandBack = async () => {
    if (!csActiveId) return;
    if (!confirm('把该会话交还给 AI 自动应答？')) return;
    try {
        await api('/admin/cs/conversations/' + csActiveId + '/handback', 'POST');
        toast('已交还给 AI');
        await csRefresh(false);
    } catch (e) {
        toast(e.message, true);
    }
};

// ==================== 分类管理 ====================
async function renderCategories() {
    const cats = await api('/admin/categories');
    const parents = cats.filter(c => c.parentId === 0);
    const children = cats.filter(c => c.parentId !== 0);
    document.getElementById('content').innerHTML = renderPanel(
        headWith('分类管理', `<button class="btn primary sm" id="addCat">+ 新增分类</button>`),
        tableWrap(`<thead><tr><th>ID</th><th>名称</th><th>类型</th><th>排序</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>
            ${parents.map(c => `
                <tr><td>${c.id}</td><td><b>${esc(c.name)}</b></td><td><span class="badge blue">一级</span></td>
                <td>${c.sortOrder}</td><td>${c.status === 1 ? '<span class="badge green">启用</span>' : '<span class="badge gray">停用</span>'}</td>
                <td><div class="ops">
                    <button class="btn ghost sm" onclick="editCat(${c.id}, '${esc(c.name)}', ${c.sortOrder}, ${c.status})">编辑</button>
                    <button class="btn danger sm" onclick="delCat(${c.id})">删除</button>
                </div></td></tr>
                ${children.filter(x => x.parentId === c.id).map(x => `
                    <tr><td>${x.id}</td><td style="padding-left:32px">↳ ${esc(x.name)}</td><td><span class="badge gray">二级</span></td>
                    <td>${x.sortOrder}</td><td>${x.status === 1 ? '<span class="badge green">启用</span>' : '<span class="badge gray">停用</span>'}</td>
                    <td><div class="ops">
                        <button class="btn ghost sm" onclick="editCat(${x.id}, '${esc(x.name)}', ${x.sortOrder}, ${x.status})">编辑</button>
                        <button class="btn danger sm" onclick="delCat(${x.id})">删除</button>
                    </div></td></tr>`).join('')}
            `).join('')}
            </tbody>`)
    );
    document.getElementById('addCat').onclick = () => openCatModal(null, parents, reload);
    window.editCat = (id, name, sort, status) => openCatModal(cats.find(c => c.id === id), parents, reload);
    window.delCat = async id => { if (!confirm('删除该分类？')) return; await api('/admin/categories/' + id, 'DELETE'); toast('已删除'); reload(); };
    function reload() { switchMod('categories'); }
}

function openCatModal(c, parents, reload) {
    const parentOptions = `<option value="0">（一级分类）</option>` + parents.map(p => `<option value="${p.id}" ${c && c.parentId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    openModal(c ? '编辑分类' : '新增分类', `

// ==================== AI 知识库（RAG 向量检索） ====================
// 这一页把「助手为什么会这么回答」摊开给人看：知识库里装了什么、检索在哪个域里做、
// 输入一句话会被召回哪几段规则、相似度各是多少、有没有被意图闸门拦下。
// 排查顺序（情况的修法完全不同，别猜）：
//   命中不了              → 这个域里没这条规则：要么知识库缺内容，要么该小节被标成了运营侧
//   命中了但被阈值砍掉     → 调对应域的 min-score（顾客侧与全量的门槛是两个独立参数）
//   命中了但答错          → 知识没问题，去改提示词
//
// ★ 域（scope）：知识库分「顾客侧」和「运营侧」（小节标题行末尾写 ops 标记，源码里是 HTML 注释形式）。
//   小发（购物助手）与 AI 客服只用顾客侧；小运（后台助手）用全量。同一句话换个域检索，
//   结果可能完全不同 —— 上面那个下拉框就是干这个用的。
//
// ★ 为什么必须分域（这是 2026-10-09 实测推翻了旧结论的地方）：
//   分域前 23 个小节混装、三个助手共用一个检索器，实测正例最高分 0.769~0.900、
//   负例最高分 0.636~0.777 —— 正例最低（怎么转人工 0.769）比负例最高（今天天气怎么样 0.777）还低，
//   分数带【交错】，任何单一阈值都救不了。而「今天天气怎么样」的高分究竟从哪来？
//   来自「按天统计的时间范围怎么算」这条后台小节（两边都有「今天」）。
//   把域分开后它在顾客池只剩 0.689，顾客池的分数带才重新拉开：正例 0.780~0.935，负例 ≤0.724。
//
// ★ 阈值（括号里都是实测值，换嵌入模型或大改知识文本必须重测，不同模型分数分布不通用）：
//   顾客池 min-score-customer=0.75，落在实测空隙 (0.724, 0.780] 的中点
//   全量池 min-score=0.79，落在实测空隙 (0.777, 0.802] 的中点
//   短问句会整体拉低向量分：「生鲜能退吗？」只有 5 个字，测得 0.780 贴门槛；
//   补全成「生鲜可以七天无理由退货吗？」就有 0.935。所以「命中不了」未必是知识缺失，也可能是问得太省略。
//
// ★ 词面加权（P3）：向量分之外再加「问句实词与小节标题的字面重合度」（只加权标题，上限 0.05）。
//   短问句信息量少、向量天然偏低，而字面重合恰恰擅长这种情况 ——
//   「怎么转人工？」向量只有 0.769（低于门槛），标题「在线客服与转人工」逐字命中，加权后 0.819 通过。
//   页面上的「向量分」与「综合分」并列显示，就是为了看清一条结果是向量召回的、还是加权顶上来的。
//
// ★ 意图闸门（P2）：命中「平台业务数字 / 后台口径概念」的问法直接跳过检索。
//   判据只有一条 —— 这个域里不可能有答案，召回任何片段都是噪声。
//   例如「今天有多少订单？」会误命中顾客侧小节，而正确答案是查库得来的数，不该由知识库来答。
//   它绝不会拦「生鲜能退吗？」这类规则问题：哪怕分低，也是知识库里真有答案的。
const KNOWLEDGE_SAMPLES = [
    { q: '满多少免运费？',             tip: '应命中「运费怎么算」（顾客侧实测 0.833）' },
    { q: '生鲜可以七天无理由退货吗？', tip: '应命中「七天无理由退货」（顾客侧实测 0.935，本例写全了条件所以分很高）' },
    { q: '券怎么没叠加？',             tip: '应命中「优惠券与活动为什么有时候不叠加」（顾客侧实测 0.930）' },
    { q: '发货几天算超时？',           tip: '应命中「发货要多久（发货时效承诺）」（顾客侧实测 0.909）' },
    { q: '怎么转人工？',               tip: '★ 词面加权的价值：向量分只有 0.769（低于门槛），标题逐字命中后综合分 0.819 通过' },
    { q: '生鲜能退吗？',               tip: '★ 贴近门槛的短问句：顾客侧实测 0.780，刚过 0.75 —— 再省略一点就会被拦' },
    { q: '今天有多少订单？',           tip: '★ 闸门对照组：平台业务数字，知识库里没有答案，顾客侧会直接跳过检索' },
    { q: '有没有卖洗衣机？',           tip: '对照组：实测 0.724，低于顾客侧门槛 0.75 —— 商品查询该由工具查库，不该走知识库' }
];

async function renderKnowledge() {

        ? '<span class="badge green">已就绪</span>'
        : (st.enabled ? '<span class="badge orange">未播种</span>' : '<span class="badge gray">已关闭</span>');

        `<tr><td><b>${k}</b></td><td>${v}</td><td class="cell-meta">${note || ''}</td></tr>`;

    document.getElementById('content').innerHTML = `

                <div class="cell-meta">顾客侧 ${st.customerSegments} / 运营侧 ${st.opsSegments}</div></div>
            <div class="stat-card"><div class="label">向量维度</div><div class="value">${st.dimension || '-'}</div>

                <div class="cell-meta">顾客侧 / 全量</div></div>

        <div class="hint" style="margin-bottom:20px;padding:14px 16px;background:var(--brand-50);border-radius:var(--radius-md);border-left:4px solid var(--brand-500);color:var(--text-700);line-height:1.8">
            助手回答<b>平台规则类</b>问题（运费、退款、发货时效、优惠叠加…）时，会先用向量检索从知识库里召回最相关的片段，
            再连同提问一起交给大模型。所以<b>这里的知识库内容 = 助手的对外口径</b>，改这里就是改助手怎么答。
            向量库建在内存中，因此每次重启后端都会按下面这份知识文本重新播种。<br>
            知识库按<b>受众域</b>分成两份：<b>顾客侧 ${st.customerSegments} 个片段</b>（小发与 AI 客服可见，只含对外规则）、
            <b>运营侧 ${st.opsSegments} 个片段</b>（GMV 口径、后台角色权限等内部口径，只有小运与这一页的「全量」能看到）。
            小节标题行末尾带 <code>&lt;!-- ops --&gt;</code> 即归入运营侧，不写则默认顾客侧。
        </div>

        <div class="panel" style="margin-bottom:22px">
            <div class="panel-head">
                <h3>检索参数</h3>
                <button class="btn ghost sm" onclick="rebuildKnowledge(this)">🔄 重建知识库</button>
            </div>
            <div class="panel-body">
                ${tableWrap(`<thead><tr><th>参数</th><th>当前值</th><th>说明</th></tr></thead><tbody>
                    ${paramRow('嵌入模型', esc(st.embeddingModel || '-'), '本地 ONNX 推理，不调用外部 API，无配额与延迟成本')}
                    ${paramRow('受众域', '顾客侧 ' + st.customerSegments + ' / 运营侧 ' + st.opsSegments, '小节标题行末尾带 &lt;!-- ops --&gt; 即归运营侧，不写默认顾客侧；漏标只是让顾客多看到一条内部口径，反方向才是真事故')}
                    ${paramRow('top-k', st.topK, '每次最终注入的知识片段数')}
                    ${paramRow('min-score（全量）', st.minScore, '小运与「全量」域用。这个池子本就是顾客规则 + 后台口径混装，顾客规则类的分数带天然交错，它在这里的职责只是把闲聊挡在外面')}
                    ${paramRow('min-score（顾客侧）', st.minScoreCustomer, '小发与 AI 客服用的门槛。候选池成分不同，分数分布就不同，必须与全量分开校准')}
                    ${paramRow('词面加权', st.hybridEnabled ? '开（标题 +' + st.hybridTitleBoost + ' / 正文 +' + st.hybridBodyBoost + '，候选 ' + st.hybridCandidateK + ' 条）' : '关（纯向量）', '把问句实词与小节标题的字面重合度加成到向量分上，用来救「短问句向量分偏低但其实逐字命中标题」的真问题；关掉即完全退化为纯向量检索')}

                    ${paramRow('chunk-size / overlap', st.chunkSize + ' / ' + st.chunkOverlap, '片段切分粒度与相邻重叠长度')}

            <div class="panel-head">
                <h3>检索测试</h3>
                <span class="cell-meta">同一句话换个域，结果可能完全不同 —— 这是排查「顾客为什么答不上来」最快的一步</span>
            </div>
            <div class="panel-body">
                <div class="toolbar">
                    <select id="kbScope" title="在哪个受众域里检索" style="max-width:210px">
                        <option value="all">全量（小运用的域）</option>
                        <option value="customer" selected>顾客侧（小发 / AI 客服）</option>
                        <option value="ops">运营侧（仅内部口径）</option>
                    </select>
                    <input id="kbQuery" maxlength="120" placeholder="输入一句用户会问的话，例如：满多少免运费？">
                    <button class="btn primary" id="kbSearchBtn" onclick="runKnowledgeSearch()">检索</button>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
                    ${KNOWLEDGE_SAMPLES.map((s, i) =>
                        `<button class="btn ghost sm" title="${esc(s.tip)}" onclick="fillKnowledgeQuery(${i})">${esc(s.q)}</button>`
                    ).join('')}
                </div>
                <div id="kbResult"><div class="empty">输入问题后点「检索」，这里会列出被召回的规则片段、相似度，以及是否被意图闸门拦下。</div></div>
            </div>
        </div>
    `;

    window.fillKnowledgeQuery = i => {
        const s = KNOWLEDGE_SAMPLES[i];
        if (!s) return;
        document.getElementById('kbQuery').value = s.q;
        runKnowledgeSearch();
    };

    window.rebuildKnowledge = async btn => {
        if (!confirm('确认重建知识库？\n\n将清空现有向量，并按当前知识文本重新切分、重新向量化，通常 1~3 秒。')) return;
        const label = btn.textContent;
        btn.disabled = true;
        btn.textContent = '重建中…';
        try {
            const r = await api('/admin/ai/knowledge/rebuild', 'POST');
            toast(`重建完成：${r.segmentCount} 个片段 / ${r.dimension} 维 / 耗时 ${r.elapsedMs}ms`);
            switchMod('knowledge');
        } catch (e) {
            toast('重建失败：' + (e.message || e), true);
            btn.disabled = false;
            btn.textContent = label;
        }
    };

    window.viewKnowledgeSource = async () => {
        try {
            const text = await api('/admin/ai/knowledge/source');
            openModal('📖 AI 知识库原文', `
                <div class="hint" style="margin-bottom:12px">
                    共 ${(text || '').length} 字。这份文本就是助手回答平台规则类问题时的唯一依据；改动后建议点一次「重建知识库」。
                </div>
                <pre style="max-height:56vh;overflow:auto;background:var(--bg-100);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;font-family:var(--font-mono);font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word">${esc(text)}</pre>
            `, null, true);
        } catch (e) {
            toast('读取失败：' + (e.message || e), true);
        }
    };

    window.runKnowledgeSearch = async () => {
        const q = (document.getElementById('kbQuery').value || '').trim();
        const scopeEl = document.getElementById('kbScope');
        const scope = scopeEl ? scopeEl.value : 'customer';
        const box = document.getElementById('kbResult');
        const btn = document.getElementById('kbSearchBtn');
        if (!q) { toast('请输入要检索的问题', true); return; }

        btn.disabled = true;
        box.innerHTML = '<div class="empty">检索中…</div>';
        try {
            const r = await api('/admin/ai/knowledge/search?scope=' + encodeURIComponent(scope)
                + '&q=' + encodeURIComponent(q));
            box.innerHTML = renderSearchResult(r);
        } catch (e) {
            box.innerHTML = `<div class="empty">检索失败：${esc(e.message || String(e))}</div>`;
        } finally {
            btn.disabled = false;
        }
    };

    window.viewGuardRules = () => {
        const rows = (st.guardRules || []).map(r =>
            `<tr><td><b>${esc(r.name)}</b></td>
                 <td><code style="font-size:12px">${esc(r.pattern)}</code></td>
                 <td class="cell-meta">${esc(r.why)}</td></tr>`).join('');
        openModal('🚧 意图闸门规则（顾客侧检索专用）', `
            <div class="hint" style="margin-bottom:14px;line-height:1.8">
                这些规则命中的问法会<b>直接跳过知识库检索</b>，而不是靠相似度阈值去拦。<br>
                判据只有一条：<b>这句话在顾客侧知识库里不可能有答案。</b>
                答案是查库得来的数字（今天有多少订单、销售额是多少），或是只存在于运营侧的内部概念
                （后台角色权限、客服接待量、低库存补货），那么召回任何顾客侧片段都只是往上下文里塞噪声 ——
                不如干净地交给工具查库，或者让助手坦白不知道。<br>
                它<b>不会</b>拦「生鲜能退吗？」这类规则问题：哪怕向量分只有 0.780、贴着门槛，也是知识库里真有答案的。
            </div>
            ${tableWrap(`<thead><tr><th>规则</th><th>正则</th><th>拦的是什么</th></tr></thead><tbody>${rows}</tbody>`)}
        `, null, true);
    };

    // 一次检索结果的渲染：先讲清「在哪个域里、门槛多少、词面加权开没开」，再列片段。
    function renderSearchResult(r) {
        const scopeMeta = {
            all:      ['全量', '不过滤；小运（后台助手）用的就是这个域'],
            customer: ['顾客侧', '只含对外规则；小发与 AI 客服用的就是这个域'],
            ops:      ['运营侧', '只含后台内部口径；没有助手单独用它，仅供排查']
        };
        const meta = scopeMeta[r.scope] || ['未知', ''];
        const head = `<div class="hint" style="margin-bottom:12px">
            域 <b>${meta[0]}</b>（${meta[1]}）；本域门槛 min-score=<b>${r.minScore}</b>；
            词面加权 <b>${r.hybridEnabled ? '开' : '关'}</b>。
        </div>`;

        if (r.blocked) {
            return head + `<div style="border:1px solid var(--border);border-left:4px solid var(--warning);border-radius:var(--radius-md);padding:16px;background:var(--card);line-height:1.9">
                🚧 <b>被意图闸门拦下，本次没有检索知识库。</b><br>
                ${esc(r.blockReason)}<br>
                <span class="cell-meta">这类问题应交由工具查库或直接回答；硬塞平台规则进上下文只会污染模型判断。
                把上面的域切到别的域再试，可以确认答案是否存在于另一侧的池子里。</span>
            </div>`;
        }

        const items = r.items || [];
        if (!items.length) {
            return head + `<div class="empty" style="text-align:left;line-height:1.9">
                这个域里没有命中任何片段 —— 最高相似度低于本域门槛 ${r.minScore}。<br>
                可能是：① 知识库里确实没有这条规则；② 有但被切分或表述影响、没被召回；
                ③ 该小节被标成了另一侧（切换上面的域试试）。<br>
                <span class="cell-meta">另外，「生鲜能退吗？」这类过短的问句向量分天然偏低，写全条件后分数会明显上升。</span>
            </div>`;
        }

        const minScore = Number(r.minScore) || 0;
        const cards = items.map((it, i) => {
            const score = Number(it.score) || 0;
            const vec = (it.vectorScore === null || it.vectorScore === undefined) ? null : Number(it.vectorScore);
            const tone = score >= 0.85 ? 'green' : (score >= minScore ? 'blue' : 'gray');
            const boost = (vec === null || score - vec <= 0.0005) ? ''
                : `<span class="badge orange" title="词面加权加上去的分">词面 +${(score - vec).toFixed(3)}</span>`;
            const vecBadge = vec === null ? '' : `<span class="badge gray">向量 ${vec.toFixed(3)}</span>`;
            return `<div style="border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px;background:var(--card)">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap">
                    <span class="badge primary">#${i + 1}</span>
                    <b style="font-size:13px">${esc(it.section || '未标注小节')}</b>
                    <span class="badge ${tone}">综合分 ${score.toFixed(3)}</span>
                    ${vecBadge}${boost}
                </div>
                <div style="font-size:13px;line-height:1.8;color:var(--text-700);white-space:pre-wrap;word-break:break-word">${esc(it.text)}</div>
            </div>`;
        }).join('');
        return head + `<div class="hint" style="margin-bottom:12px">共召回 <b>${items.length}</b> 个片段（按综合分降序，已通过 min-score=${minScore} 过滤；「综合分」= 向量分 + 词面加权）</div>${cards}`;
    }
}

let modalOkHandler = null;
function openModal(title, bodyHtml, onOk, hideFooter = false, okText = '确定', cancelText = '取消') {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalMask').classList.add('show');
    document.getElementById('modalFoot').style.display = hideFooter ? 'none' : 'flex';
    document.getElementById('modalOk').textContent = okText;
    document.getElementById('modalCancel').textContent = cancelText;
    modalOkHandler = onOk;
}
function closeModal() { document.getElementById('modalMask').classList.remove('show'); modalOkHandler = null; }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalMask').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('modalOk').onclick = async () => {
    if (!modalOkHandler) return closeModal();
    try { await modalOkHandler(); closeModal(); }
    catch (err) { toast(err.message, true); }
};

// ==================== AI 营销文案（内联面板） ====================
// 设计约束：整个页面只有一个 modal 容器，绝不能嵌套弹窗。因此 AI 面板作为「内联展开区」
// 渲染在当前 modalBody 内部（见 openProductModal / openPromoModal 里的 #aiProdPanel/#aiPromoPanel）。
// 每个面板独立：场景/渠道下拉 + 补充说明 + 生成/重新生成 + 结果分区展示 + 每字段独立「填入」。
// 注意：本 script 块内不得出现字面注释符 &lt;!-- 或 --&gt;（HTML 解析器会吞掉后续脚本）。
window._aiPanels = {};
window._aiResults = {};
let _aiMarketingDict = null;

async function aiCopyLoadDict() {
    if (_aiMarketingDict) return _aiMarketingDict;
    try {
        const d = await api('/admin/ai/marketing/scenes');
        if (d && d.scenes && d.channels) {
            _aiMarketingDict = d;
            return d;
        }
    } catch (e) {
        // 拉取字典失败则退回内置默认，保证面板仍可用
    }
    _aiMarketingDict = {
        scenes: [{ code: 'PRODUCT', label: '商品文案' }, { code: 'PROMOTION', label: '活动文案' }],
        channels: [
            { code: 'DETAIL', label: '商品详情页' },
            { code: 'HOME_CARD', label: '首页卡片' },
            { code: 'PUSH', label: '短信推送' },
            { code: 'SOCIAL', label: '社群/朋友圈' }
        ]
    };
    return _aiMarketingDict;
}

function aiCopyOptions(list, selected) {
    return (list || []).map(o =>
        `<option value="${esc(o.code)}" ${o.code === selected ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
}

async function aiCopyMount(panelId, cfg) {
    const panel = document.getElementById(panelId);
    if (!panel) return;
    window._aiPanels[panelId] = cfg || {};
    window._aiResults[panelId] = null; // 每次打开弹窗都从干净状态开始，避免残留上次结果
    const dict = await aiCopyLoadDict();
    const sceneDefault = (cfg && cfg.sceneDefault) || 'PRODUCT';
    const channelDefault = (cfg && cfg.channelDefault) || 'DETAIL';
    panel.innerHTML = `
        <div class="form-row two">
            <div><label>文案场景</label><select id="${panelId}Scene">${aiCopyOptions(dict.scenes, sceneDefault)}</select></div>
            <div><label>投放渠道</label><select id="${panelId}Channel">${aiCopyOptions(dict.channels, channelDefault)}</select></div>
        </div>
        <div class="form-row"><label>补充说明（关键词 / 规格 / 产地 / 限时 / 目标人群；也可直接粘贴「想改写的现有文案」）</label>
            <textarea id="${panelId}Extra" placeholder="如：现摘脆甜 陕西洛川产 5斤装 限时3天；也可直接粘贴一段想改写的文案"></textarea></div>
        <div class="form-row">
            <button type="button" class="btn primary sm" id="${panelId}Gen" onclick="aiCopyGenerate('${panelId}')">✨ 生成文案</button>
            <span class="hint" id="${panelId}Status" style="margin-left:10px"></span>
        </div>
        <div id="${panelId}Result"></div>`;
}

function aiCopyToggle(panelId) {
    const panel = document.getElementById(panelId);
    if (!panel) return;
    const hidden = !panel.style.display || panel.style.display === 'none';
    panel.style.display = hidden ? 'block' : 'none';
    if (hidden && panel.scrollIntoView) panel.scrollIntoView({ block: 'nearest' });
}

async function aiCopyGenerate(panelId) {
    const cfg = window._aiPanels[panelId];
    if (!cfg) return;
    const btn = document.getElementById(panelId + 'Gen');
    const statusEl = document.getElementById(panelId + 'Status');
    const sceneSel = document.getElementById(panelId + 'Scene');
    const channelSel = document.getElementById(panelId + 'Channel');
    const extraEl = document.getElementById(panelId + 'Extra');
    const req = Object.assign({}, cfg.build ? cfg.build() : {});
    req.scene = sceneSel ? sceneSel.value : (cfg.sceneDefault || 'PRODUCT');
    req.channel = channelSel ? channelSel.value : (cfg.channelDefault || 'DETAIL');
    req.extra = extraEl ? extraEl.value.trim() : (req.extra || '');
    if (!req.name && !req.extra && !req.existing) { toast('请先填写名称、补充说明，或需要改写的内容', true); return; }

    btn.disabled = true;
    btn.textContent = '生成中…';
    if (statusEl) statusEl.textContent = 'AI 正在创作，请稍候（约需数秒）…';
    try {
        const data = await api('/admin/ai/marketing/copy', 'POST', req);
        window._aiResults[panelId] = data;
        aiCopyRender(panelId, data);
        if (statusEl) statusEl.textContent = '完成，用时 ' + (data.elapsedMs || 0) + ' ms';
    } catch (e) {
        if (statusEl) statusEl.textContent = '';
        toast(e.message || '生成失败，请稍后重试', true);
    } finally {
        btn.disabled = false;
        btn.textContent = window._aiResults[panelId] ? '🔄 重新生成' : '✨ 生成文案';
    }
}

function aiCopyRender(panelId, d) {
    const box = document.getElementById(panelId + 'Result');
    if (!box) return;
    const fill = (window._aiPanels[panelId] && window._aiPanels[panelId].fill) || {};
    const empty = '<span style="color:var(--muted-foreground)">（空）</span>';
    const row = (label, field, value) => {
        const val = (value === null || value === undefined || value === '') ? empty : esc(value);
        const btn = fill[field]
            ? `<button type="button" class="btn ghost sm" onclick="aiCopyFill('${panelId}','${field}')">填入</button>` : '';
        return `<div class="form-row" style="margin-bottom:10px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
                <label style="margin:0">${label}</label>${btn}
            </div>
            <div style="font-size:13px;line-height:1.6;word-break:break-word;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm)">${val}</div>
        </div>`;
    };
    const points = (d.sellingPoints && d.sellingPoints.length)
        ? d.sellingPoints.map(s => `<span class="badge primary" style="margin:0 6px 6px 0">${esc(s)}</span>`).join('')
        : empty;
    const spBtn = fill.sellingPoints
        ? `<button type="button" class="btn ghost sm" onclick="aiCopyFill('${panelId}','sellingPoints')">填入</button>` : '';
    const tips = (d.tips && d.tips.length)
        ? `<div class="hint" style="padding:8px 10px;background:var(--brand-50);border-radius:var(--radius-sm);color:var(--brand-800)">${d.tips.map(esc).join('；')}</div>`
        : '';
    box.innerHTML = `
        ${row('标题', 'title', d.title)}
        ${row('副标题', 'subtitle', d.subtitle)}
        <div class="form-row" style="margin-bottom:10px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
                <label style="margin:0">卖点</label>${spBtn}
            </div>
            <div style="padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm)">${points}</div>
        </div>
        ${row('正文', 'body', d.body)}
        ${row('行动号召', 'cta', d.cta)}
        ${tips}`;
}

function aiCopyFill(panelId, field) {
    const cfg = window._aiPanels[panelId];
    const data = window._aiResults[panelId];
    if (!cfg || !data) return;
    const targetId = cfg.fill ? cfg.fill[field] : null;
    if (!targetId) { toast('该字段没有可填入的位置', true); return; }
    const el = document.getElementById(targetId);
    if (!el) { toast('未找到目标输入框', true); return; }
    const val = field === 'sellingPoints'
        ? (data.sellingPoints || []).join(' ')
        : (data[field] == null ? '' : String(data[field]));
    if (!val) { toast('该字段为空，无需填入', true); return; }
    const cur = (el.value || '').trim();
    if (cur && cur !== val && !confirm('目标输入框已有内容，确认覆盖？')) return;
    el.value = val;
    toast('已填入');
}

function showLowStockAlert(items) {

        const gap = LOW_STOCK_THRESHOLD - p.stock;
        return `<tr>

    }).join('');
    openModal('⚠️ 库存预警', `
        <div class="hint" style="margin-bottom:16px;padding:14px;background:var(--brand-50);border-radius:var(--radius-md);border-left:4px solid var(--warning);color:var(--brand-800)">
            有 <b style="color:var(--destructive)">${items.length}</b> 件商品库存低于安全阈值（<b>${LOW_STOCK_THRESHOLD}</b> 件），请及时补货。
        </div>
        <div style="overflow:auto;max-height:340px">
            ${tableWrap(`<thead><tr><th>商品名称</th><th>当前库存</th><th>低于阈值差额</th></tr></thead><tbody>${rows}</tbody>`)}
        </div>
    `, () => { switchMod('stock'); }, false, '前往补货', '稍后处理');
}

const AI_SUGGESTIONS = [
    '最近 5 单待发货有哪些？',
    '这周 GMV 多少？',
    '库存预警有哪些商品？',
    '搜索含"苹果"的商品',

];

function appendAiTip(text) {

    div.textContent = text;

    aiMessages.scrollTop = aiMessages.scrollHeight;
}

function appendAiSuggestions() {

}

/**
 * 渲染小运本轮返回的「待确认提案卡片」与「追问选项」。
 *
 * <p><b>卡片上没有一个数字是前端算的</b>：金额、状态变化、库存、订单号全部来自
 * {@code proposal.fields[]} / {@code actionLabel} / {@code targetLabel} / {@code risk} /
 * {@code precheck}，{@code XiaoyunAction} 只负责排版。这是为了解决「同一件事在后台列表、
 * 小运答复、卡片三处显示不一致」的老问题。
 *
 * <p>提案为空时**什么都不渲染** —— 后端只会把 {@code prepare_*} 工具的真实返回编译成提案，
 * 所以「模型嘴上说已准备好卡片、实际没调工具」的结果就是 0 张卡片，而不是一张假卡片。
 *
 * <p>执行成功后顺手刷新侧边栏红点（退款/客服待办数会变），失败不动。
 */
function renderAiProposals(data) {
    if (!data || typeof XiaoyunAction === 'undefined') return;

    // needsClarification 目前后端返回 Boolean（弱信号：只用于提示，不拦卡片）。
    // 若将来后端改成 {options:[...]}，这里无需改动即可渲染可点选项。
    const nc = data.needsClarification;
    const clarifyOptions = (nc && typeof nc === 'object' && Array.isArray(nc.options)) ? nc.options : null;
    if (clarifyOptions) {
        XiaoyunAction.renderOptions(aiMessages, clarifyOptions, text => {
            aiInput.value = text;
            aiInput.focus();
        });
    }

    if (!Array.isArray(data.proposals) || !data.proposals.length) return;

    XiaoyunAction.renderAll(aiMessages, data.proposals, {
        onSettled: (proposal, env) => {
            if (!env || env.code !== 0) return;
            try {
                if (typeof refreshRefundUnread === 'function') refreshRefundUnread();
                if (typeof refreshCsUnread === 'function') refreshCsUnread();
                if (typeof refreshRiskUnread === 'function') refreshRiskUnread();
                // 「风险消息一键已读」执行完成后，若风险页正开着，把列表重画一遍：
                // 否则旧行上的「●」未读点和「标已读」按钮会留在那里，看起来像没生效。
                if (currentMod === 'risk' && typeof renderRisk === 'function') renderRisk();
            } catch (e) {
                // 红点刷新失败绝不能影响卡片状态展示
            }
        }
    });
}

async function sendAiMsg() {
    if (aiBusy) return;
    const text = aiInput.value.trim();
    if (!text) return;
    appendAiMsg(text, 'user');
    aiInput.value = '';
    aiInput.style.height = '42px';

    aiBusy = true;
    document.getElementById('aiSend').disabled = true;
    const placeholder = appendAiMsg('正在查询数据并整理答复…', 'bot thinking');

    try {
        const data = await api('/admin/ai/assistant', 'POST', { message: text });
        placeholder.classList.remove('thinking');
        placeholder.textContent = ((data && data.answer) || '').trim() || '（无答复）';
        // 卡片紧跟在答复气泡下面（同一条消息流），不另开弹窗
        renderAiProposals(data);
    } catch (e) {
        placeholder.classList.remove('thinking');
        placeholder.classList.add('error');
        placeholder.textContent = '网络异常：' + (e.message || e);
    } finally {
        aiBusy = false;
        document.getElementById('aiSend').disabled = false;
        aiMessages.scrollTop = aiMessages.scrollHeight;
        aiInput.focus();
    }
}

async function loadAiHistory() {
    try {
        const history = await api('/admin/ai/history');
        if (history && history.length) {
            // 有历史时用历史替换默认欢迎语，恢复上次会话
            aiMessages.innerHTML = '';
            history.forEach(m => appendAiMsg(m.content || '', m.role === 'user' ? 'user' : 'bot'));
        }
    } catch (e) {
        // 拉取失败保持默认欢迎语，不打断使用
    }
    aiMessages.scrollTop = aiMessages.scrollHeight;
}

/**
 * 常驻「待确认操作」区块：进入小运时拉取「当前登录人 · 未过期 · 待确认」的提案。
 *
 * <p>为什么需要它：确认卡片原先只存在于「当轮对话响应」里，刷新页面后
 * {@code /admin/ai/history} 只回放文字、不重绘卡片，而提案只有 5 分钟 TTL ——
 * 用户会看到小运说「请点击卡片确认」，界面上却没有卡片可点。
 *
 * <p>数据结构与对话响应里的 {@code proposals} 完全一致，因此直接复用
 * {@code XiaoyunAction.renderAll}，卡片渲染逻辑零改动。
 *
 * <p>执行成功（{@code env.code === 0}）后把该卡从区块移除并更新计数；
 * 数量归零时隐藏区块；接口为空或失败时**不渲染任何占位**，不影响正常对话。
 */
async function loadAiPending() {
    // 每次进入小运都重建，避免重复打开时叠出多个区块
    const stale = document.getElementById('aiPendingBlock');
    if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
    if (typeof XiaoyunAction === 'undefined') return;

    let list;
    try {
        list = await api('/admin/ai/actions/pending');
    } catch (e) {
        return; // 拉取失败不打断对话：区块不出现即可
    }
    if (!Array.isArray(list) || !list.length) return; // 为空不渲染任何占位

    const wrap = document.createElement('div');
    wrap.className = 'xy-pending';
    wrap.id = 'aiPendingBlock';

    const head = document.createElement('div');
    head.className = 'xy-pending-head';
    const title = document.createElement('span');
    title.textContent = '待确认操作';
    const count = document.createElement('span');
    count.className = 'xy-pending-count';
    count.textContent = String(list.length);
    head.appendChild(title);
    head.appendChild(count);
    wrap.appendChild(head);

    const listEl = document.createElement('div');
    listEl.className = 'xy-pending-list';
    wrap.appendChild(listEl);

    // 插到消息流最顶部（历史对话与欢迎语之上），保持「待办优先」的视觉顺序
    aiMessages.insertBefore(wrap, aiMessages.firstChild);

    const cards = XiaoyunAction.renderAll(listEl, list, {
        onSettled: (proposal, env) => {
            if (!env || env.code !== 0) return; // 失败保留卡片，让运营看到原因
            try {
                const card = listEl.querySelector(
                    '.xy-card[data-proposal-id="' + (proposal && proposal.proposalId ? proposal.proposalId : '') + '"]');
                if (card && card.parentNode) card.parentNode.removeChild(card);
                const left = listEl.querySelectorAll('.xy-card').length;
                count.textContent = String(left);
                if (left === 0) wrap.style.display = 'none';
            } catch (e) {
                // DOM 更新失败绝不能影响卡片自身的状态展示
            }
            try {
                if (typeof refreshRefundUnread === 'function') refreshRefundUnread();
                if (typeof refreshCsUnread === 'function') refreshCsUnread();
                if (typeof refreshRiskUnread === 'function') refreshRiskUnread();
            } catch (e) {
                // 红点刷新失败忽略
            }
        }
    });

    // 计数以「真正渲染出来的卡片」为准：结构不可用的提案会被 renderAll 跳过
    count.textContent = String(cards.length);
    if (!cards.length) {
        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    }
}

function initAiAssistant() {
    document.getElementById('aiFab').onclick = async () => {
        document.getElementById('aiMask').classList.add('show');
        resetAiDialog();
        // 先回放历史（loadAiHistory 可能清空消息列表），再插入待确认区块，
        // 否则区块会被随后的 history 覆盖掉。
        await loadAiHistory();
        loadAiPending();
        aiInput.focus();
    };
    document.getElementById('aiClose').onclick = () => document.getElementById('aiMask').classList.remove('show');
    document.getElementById('aiClear').onclick = async () => {
        if (!confirm('确定清空本次会话及 AI 的长期记忆吗？')) return;
        try {
            await api('/admin/ai/memory', 'DELETE');
            toast('已清空 AI 会话与长期记忆');
        } catch (e) {
            toast('清空失败：' + (e.message || e), true);
        } finally {
            resetAiDialog(); // 无论后端结果如何，都清空本地 DOM 作为兜底
        }
    };
    document.getElementById('aiSend').onclick = sendAiMsg;
    aiInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendAiMsg();
        }
    });
    aiInput.addEventListener('input', () => {
        aiInput.style.height = 'auto';
        aiInput.style.height = Math.min(aiInput.scrollHeight, 130) + 'px';
    });
}

// ==================== 启动 ====================
function initChartHover() {
    const box = document.getElementById('content');
    if (!box) return;
    box.addEventListener('mouseover', e => {
        const p = e.target.closest('.chart-donut .arc path');
        if (p) {
            p.style.transition = 'transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            p.style.transformOrigin = '0 0';
            p.style.transform = 'scale(1.12)';
        }
    });
    box.addEventListener('mouseout', e => {
        const el = e.target.closest('.chart-donut .arc path');
        if (el && (!e.relatedTarget || !el.contains(e.relatedTarget))) {
            el.style.transform = '';
        }
    });
}

async function init() {
    if (!getToken()) { window.location.href = '/login.html'; return; }
    const me = await loadMe();
    if (!me) { window.location.href = '/login.html'; return; }
    document.getElementById('logoutBtn').onclick = logout;
    applyNavVisibility();
    const navMod = (currentMod && document.querySelector('#nav a[data-mod="' + currentMod + '"]:not([style*="display: none"])')) ? currentMod : 'dashboard';
    switchMod(navMod);
    checkLowStockAlert();
    initAiAssistant();
    refreshRiskUnread();
    refreshCsUnread();
    refreshRefundUnread();
}
initChartHover();
init();
</script>
