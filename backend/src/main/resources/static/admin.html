<script src="xiaoyun-action.js?v=2"></script>
<script>
// ==================== 基础封装 ====================
const TOKEN_KEY = 'token';
const USER_KEY = 'user';
let ME = null;

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function logout() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    window.location.href = '/login.html';
}

function hasPerm(...codes) {
    if (!ME) return false;
    if (ME.role === 'ADMIN') return true;
    const set = ME.permissions || [];
    return codes.some(c => set.includes(c));
}
function hasRole(role) { return ME && ME.role === role; }

async function loadMe() {
    try {
        const me = await api('/auth/me');
        ME = me;
        const nameEl = document.getElementById('userName');
        const badge = document.getElementById('roleBadge');
        if (nameEl) nameEl.textContent = me.nickname || me.username || '-';
        if (badge) {
            badge.textContent = roleLabel(me.role);
            badge.className = 'role-badge r-' + (me.role || 'USER');
            badge.style.display = 'inline-block';
        }
        return me;
    } catch (e) {
        return null;
    }
}

function applyNavVisibility() {
    document.querySelectorAll('#nav a[data-perm]').forEach(a => {
        const spec = a.getAttribute('data-perm') || '';
        if (spec === '__ADMIN_ONLY__') {
            a.style.display = hasRole('ADMIN') ? '' : 'none';
            return;
        }
        if (spec === '') {
            a.style.display = '';
            return;
        }
        const codes = spec.split(',').map(s => s.trim()).filter(Boolean);
        a.style.display = hasPerm(...codes) ? '' : 'none';
    });
    // AI 运营助手悬浮球仅管理员可用：其后端接口 /admin/ai/* 已由 @RequireAdmin 收紧为仅 ADMIN，
    // 非管理员若仍看到悬浮球会点开即 403，这里一并按 ADMIN 收起（元素取不到时静默跳过）。
    const aiFab = document.getElementById('aiFab');
    if (aiFab) aiFab.style.display = hasRole('ADMIN') ? '' : 'none';
}

/**
 * 统一请求封装。
 *
 * <p>T05 扩展了两个可选参数（既有调用一行都不用改）：
 * <ul>
 *   <li>{@code extraHeaders}：透传额外请求头。小运确认卡片要用
 *       {@code Idempotency-Key}（防连点）与 {@code X-Proposal-Id}（让服务端找回提案行）。</li>
 *   <li>{@code raw}：为 true 时返回**完整信封** {@code {code, subCode, message, data}}，
 *       而不是只返回 {@code data}。卡片必须区分「成功」「已执行过（DUPLICATE_ACTION）」
 *       「失败」，而默认模式下 {@code code!==0} 会被抛成异常、{@code subCode} 被丢掉，
 *       分不清这三种情况。</li>
 * </ul>
 * 注意：401/403 的处理**在 raw 之前**，所以两种模式下的登录态行为完全一致。
 */
async function api(path, method = 'GET', body = null, extraHeaders = null, raw = false) {
    const headers = { 'Content-Type': 'application/json' };
    const token = getToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (extraHeaders && typeof extraHeaders === 'object') {
        Object.keys(extraHeaders).forEach(k => {
            const v = extraHeaders[k];
            // 空值不写进请求头：fetch 会把 null 序列化成字符串 "null"，服务端会当成有效键
            if (v !== null && v !== undefined && String(v) !== '') headers[k] = String(v);
        });
    }
    const opts = { method, headers, cache: 'no-store' };
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch('/api' + path, opts);
    if (resp.status === 401) { logout(); throw new Error('登录已过期'); }
    const json = await resp.json().catch(() => ({}));
    if (resp.status === 403) throw new Error(json.message || '需要管理员权限');
    if (raw) return json;
    if (json.code !== 0) throw new Error(json.message || '请求失败');
    return json.data;
}

function toast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.display = 'none', 2500);
}

function esc(s) {
    if (s === null || s === undefined) return '-';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(v) { return v == null ? '-' : '¥' + Number(v).toFixed(2); }
function fmtTime(t) { return t ? String(t).replace('T', ' ').substring(0, 19) : '-'; }

function roleLabel(r) {
    return r === 'ADMIN' ? '超级管理员' : r === 'OPS' ? '运营专员' : r === 'CS' ? '客服' : '普通用户';
}
function roleBadgeOf(role) {
    const map = {
        ADMIN: ['超级管理员', 'red'],
        OPS:   ['运营专员',   'blue'],
        CS:    ['客服',       'orange'],
        USER:  ['普通用户',   'gray']
    };
    const e = map[role] || ['未知', 'gray'];
    return `<span class="badge ${e[1]}">${e[0]}</span>`;
}

const ORDER_STATUS = { PENDING_PAYMENT:['待付款','orange'], PAID:['待发货','blue'], SHIPPED:['待收货','blue'], COMPLETED:['已完成','green'], CANCELLED:['已取消','gray'], REFUNDING:['退款中','orange'], REFUNDED:['已退款','gray'] };
const PAY_STATUS = { SUCCESS:['成功','green'], REFUNDED:['已退款','orange'], FAILED:['失败','red'] };
const PAY_METHOD = { WECHAT:'微信', ALIPAY:'支付宝', BANK:'银行卡', CASH:'现金', BALANCE:'余额支付' };
const SHIP_STATUS = { SHIPPED:['已发货','blue'], IN_TRANSIT:['运输中','orange'], DELIVERED:['已送达','green'] };
const PROMO_TYPE = { FULL_REDUCTION:'满减', DISCOUNT:'折扣' };
const LOW_STOCK_THRESHOLD = 10;
// 发货时效 SLA（天）—— 与后端 AdminService.SLA_SHIP_DAYS 保持一致，改一处记得同步另一处
const SLA_SHIP_DAYS = 2;

const SHIP_COMPANIES = [
    { name: '顺丰速运', prefix: 'SF' },
    { name: '中通快递', prefix: 'ZT' },
    { name: '圆通速递', prefix: 'YT' },
    { name: '韵达快递', prefix: 'YD' },
    { name: '申通快递', prefix: 'ST' },
    { name: '京东物流', prefix: 'JD' },
    { name: '邮政EMS', prefix: 'EMS' },
    { name: '极兔速递', prefix: 'JT' },
    { name: '德邦物流', prefix: 'DB' },
];
function genTrackingNo(company) {
    const found = SHIP_COMPANIES.find(c => c.name === company);
    const prefix = found ? found.prefix : 'SF';
    const len = prefix === 'EMS' ? 13 : 12;
    let num = '';
    for (let i = 0; i < len; i++) num += Math.floor(Math.random() * 10);
    return prefix + num;
}

function statusBadge(status, map) {
    const [label, color] = (map[status] || ['未知','gray']);
    return `<span class="badge ${color}">${label}</span>`;
}

// ==================== 图表（D3 SVG） ====================
const CHART_COLORS = ['var(--primary)', 'var(--chart-2)', 'var(--success-500)', 'var(--warning)', 'var(--info)', 'var(--chart-4)', 'var(--chart-5)', 'var(--text-400)'];

function emptyChart(msg) {
    return `<div class="empty">${msg || '暂无数据'}</div>`;
}

function fmtK(v) {
    if (v >= 10000) return (v / 10000).toFixed(1) + '万';
    if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
    return v.toFixed(0);
}

function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || name;
}

function themeColor(raw) {
    return String(raw).startsWith('var(') ? cssVar(raw) : raw;
}

function donutChart(items, opts = {}) {
    const data = (items || []).filter(x => (x.value || 0) > 0);
    if (!data.length) return emptyChart();
    const total = d3.sum(data, d => d.value);
    const W = 420, H = 220, radius = 82, cx = 110, cy = H / 2;
    const color = d3.scaleOrdinal(data.map(d => d.name)).range(CHART_COLORS.map(themeColor));

    const div = d3.create('div').attr('class', 'chart-donut').style('width', '100%');
    const svg = div.append('svg')
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('preserveAspectRatio', 'xMidYMid meet')
        .style('width', '100%').style('height', 'auto').style('display', 'block');

    const g = svg.append('g').attr('transform', `translate(${cx},${cy})`);
    const pie = d3.pie().value(d => d.value).sort(null).padAngle(0.03);
    const arc = d3.arc().innerRadius(radius * 0.62).outerRadius(radius);
    const arcs = g.selectAll('.arc').data(pie(data)).join('g').attr('class', 'arc');
    arcs.append('path')
        .attr('d', arc)
        .attr('fill', d => color(d.data.name))
        .attr('stroke', cssVar('--card'))
        .attr('stroke-width', 2)
        .append('title').text(d => `${esc(d.data.name)}：${d.data.value}（${((d.endAngle - d.startAngle) / (2 * Math.PI) * 100).toFixed(1)}%）`);

    g.append('text').attr('text-anchor', 'middle').attr('dy', '-0.15em')
        .attr('font-size', 22).attr('font-weight', 600).attr('fill', cssVar('--foreground')).text(total);
    g.append('text').attr('text-anchor', 'middle').attr('dy', '1.4em')
        .attr('font-size', 11).attr('fill', cssVar('--muted-foreground')).text(opts.centerLabel || '总数');

    const legend = svg.append('g').attr('transform', `translate(${cx + radius + 34}, ${cy - data.length * 13})`);
    const rows = legend.selectAll('.lg').data(data).join('g').attr('transform', (d, i) => `translate(0,${i * 26})`);
    rows.append('circle').attr('r', 5).attr('fill', d => color(d.name));
    rows.append('text').attr('x', 12).attr('y', 4).attr('font-size', 12).attr('fill', cssVar('--foreground')).text(d => esc(d.name));
    rows.append('text').attr('x', 12).attr('y', 16).attr('font-size', 11).attr('fill', cssVar('--muted-foreground'))
        .text(d => { const pct = (d.value / total * 100).toFixed(1); return `${d.value} · ${pct}%`; });

    return div.node().outerHTML;
}

function hbarChart(items, opts = {}) {
    const data = (items || []).filter(x => (x.value || 0) > 0).sort((a, b) => b.value - a.value).slice(0, 14);
    if (!data.length) return emptyChart();
    const W = 760, rowH = 30, H = data.length * rowH + 60;
    const margin = { top: 18, right: 70, bottom: 30, left: 140 };
    const width = W - margin.left - margin.right, height = H - margin.top - margin.bottom;
    const barColor = opts.color ? themeColor(opts.color) : cssVar('--primary');

    const div = d3.create('div').attr('class', 'chart-hbar').style('width', '100%');
    const svg = div.append('svg')
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('preserveAspectRatio', 'xMidYMid meet')
        .style('width', '100%').style('height', 'auto').style('display', 'block');
    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    const x = d3.scaleLinear().domain([0, d3.max(data, d => d.value)]).nice().range([0, width]);
    const y = d3.scaleBand().domain(data.map(d => d.name)).range([0, height]).padding(0.22);

    g.append('g').attr('class', 'grid')
        .attr('transform', `translate(0,${height})`)
        .call(d3.axisBottom(x).tickSize(-height).tickFormat(''))
        .call(g => g.select('.domain').remove())
        .attr('stroke', cssVar('--border')).attr('stroke-opacity', 0.6);

    g.selectAll('.bar').data(data).join('rect')
        .attr('class', 'bar')
        .attr('x', 0).attr('y', d => y(d.name))
        .attr('width', d => x(d.value)).attr('height', y.bandwidth())
        .attr('rx', 5).attr('fill', barColor)
        .append('title').text(d => `${esc(d.name)}：${d.value}`);

    g.selectAll('.label').data(data).join('text')
        .attr('x', -10).attr('y', d => y(d.name) + y.bandwidth() / 2)
        .attr('dy', '0.35em').attr('text-anchor', 'end')
        .attr('font-size', 12).attr('fill', cssVar('--foreground'))
        .text(d => esc(d.name));

    g.selectAll('.val').data(data).join('text')
        .attr('x', d => x(d.value) + 8).attr('y', d => y(d.name) + y.bandwidth() / 2)
        .attr('dy', '0.35em')
        .attr('font-size', 12).attr('fill', cssVar('--muted-foreground')).text(d => d.value);

    return div.node().outerHTML;
}

function trendChart(points) {
    const data = points || [];
    if (!data.length) return emptyChart();

    trendChart._id = (trendChart._id || 0) + 1;
    const uid = 'trend-' + trendChart._id;
    const W = 960, H = 300;
    const margin = { top: 18, right: 32, bottom: 48, left: 74 };
    const width = W - margin.left - margin.right, height = H - margin.top - margin.bottom;
    const primary = cssVar('--primary');
    const border = cssVar('--border');
    const muted = cssVar('--muted-foreground');

    // ---- 日环比（对比基准 = 前一个自然日）----
    // 数据来源：GET /api/admin/dashboard/charts → salesTrend（近 7 个自然日，含今天）。
    // 每天的 salesAmount 与「最新日销售额」完全同口径：已收款且未退款
    // （PAID/SHIPPED/COMPLETED/REFUNDING，不含 待付款/已取消/已退款）。
    // 公式：日环比 = (今日 − 昨日) / 昨日 × 100%
    // 注意：早先这里误用窗口首日(data[0])当基准，而首日往往是空数据(0)，
    // 于是 `first ? ... : 0` 一直命中兜底，增长率恒显示 +0.00%。
    const total = d3.sum(data, d => Number(d.salesAmount) || 0);
    const latestPoint = data[data.length - 1];
    const latest = Number(latestPoint && latestPoint.salesAmount) || 0;
    const prevPoint = data.length >= 2 ? data[data.length - 2] : null;
    const prev = prevPoint ? (Number(prevPoint.salesAmount) || 0) : null;

    let badgeClass, badgeText, badgeTip;
    if (prev === null) {
        // 基准缺失：窗口内不足两天
        badgeClass = 'gray';
        badgeText = '无对比基准';
        badgeTip = '窗口内仅有 1 天数据，无法计算日环比';
    } else if (prev === 0) {
        // 分母为 0：环比在数学上无定义（既不是 0%，也不是无穷大），不显示百分比以免误导
        badgeClass = 'gray';
        if (latest === 0) {
            badgeText = '0.00%';
            badgeTip = `昨日(${prevPoint.date})与今日销售额均为 ¥0.00，环比持平`;
        } else {
            badgeText = '环比不可比';
            badgeTip = `昨日(${prevPoint.date})销售额为 ¥0.00，不能作分母；今日 ¥${latest.toFixed(2)}，环比无法计算`;
        }
    } else {
        const change = ((latest - prev) / prev) * 100;
        if (change === 0) {
            // 持平：不带 +/- 号，避免 "+0.00%" 让人误以为在增长
            badgeClass = 'gray';
            badgeText = '0.00%';
            badgeTip = `与前一日 ${prevPoint.date} 持平：均为 ¥${latest.toFixed(2)}`;
        } else {
            const up = change > 0;
            badgeClass = up ? 'green' : 'red';
            badgeText = `${up ? '+' : ''}${change.toFixed(2)}%`;
            badgeTip = `较前一日 ${prevPoint.date}：¥${prev.toFixed(2)} → ¥${latest.toFixed(2)}（环比 ${badgeText}）`;
        }
    }
    const badgeCaption = prevPoint ? `较前一日 ${prevPoint.date}` : '较前一日';

    const summary = `
        <div style="display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap">
            <div>
                <div style="font-size:12px;color:${muted};margin-bottom:2px">最新日销售额</div>
                <div style="font-size:28px;font-weight:700;color:${cssVar('--foreground')};line-height:1.05">${fmtMoney(latest)}</div>
            </div>
            <span class="badge ${badgeClass}" style="margin-bottom:6px" title="${badgeTip}">${badgeText}</span>
            <span style="font-size:12px;color:${muted};margin-bottom:8px">${badgeCaption}</span>
            <div style="margin-left:auto;text-align:right">
                <div style="font-size:12px;color:${muted};margin-bottom:2px">7 天累计</div>
                <div style="font-size:16px;font-weight:600;color:${cssVar('--foreground')}">${fmtMoney(total)}</div>
            </div>
        </div>`;

    const div = d3.create('div').style('width', '100%');
    const svg = div.append('svg')
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('preserveAspectRatio', 'xMidYMid meet')
        .style('width', '100%').style('height', 'auto').style('display', 'block');
    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    const defs = svg.append('defs');
    const areaGrad = defs.append('linearGradient').attr('id', `${uid}-area`).attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 1);
    areaGrad.append('stop').attr('offset', '0%').attr('stop-color', primary).attr('stop-opacity', 0.28);
    areaGrad.append('stop').attr('offset', '100%').attr('stop-color', primary).attr('stop-opacity', 0.02);

    const x = d3.scalePoint().domain(data.map(d => d.date)).range([0, width]).padding(0.06);
    const maxSales = d3.max(data, d => Number(d.salesAmount) || 0);
    const ySales = d3.scaleLinear().domain([0, maxSales * 1.15]).nice().range([height, 0]);

    // horizontal grid
    g.append('g').attr('class', 'grid')
        .call(d3.axisLeft(ySales).tickSize(-width).tickFormat(''))
        .call(g => g.select('.domain').remove())
        .attr('stroke', border).attr('stroke-opacity', 0.35).attr('shape-rendering', 'crispEdges');

    // axes
    const xAxis = g.append('g').attr('transform', `translate(0,${height})`)
        .call(d3.axisBottom(x).tickSize(0).tickPadding(12));
    xAxis.select('.domain').attr('stroke', border);
    xAxis.selectAll('text').attr('fill', muted).attr('font-size', 11).attr('font-weight', 500);

    const yLeft = g.append('g').call(d3.axisLeft(ySales).ticks(5).tickFormat(d => '¥' + fmtK(d)).tickSize(0).tickPadding(10));
    yLeft.select('.domain').remove();
    yLeft.selectAll('text').attr('fill', muted).attr('font-size', 11);

    // area
    const area = d3.area()
        .x(d => x(d.date))
        .y0(height)
        .y1(d => ySales(Number(d.salesAmount) || 0))
        .curve(d3.curveMonotoneX);
    g.append('path').datum(data).attr('fill', `url(#${uid}-area)`).attr('d', area);

    // line
    const line = d3.line()
        .x(d => x(d.date))
        .y(d => ySales(Number(d.salesAmount) || 0))
        .curve(d3.curveMonotoneX);
    g.append('path').datum(data).attr('fill', 'none')
        .attr('stroke', primary).attr('stroke-width', 2.5).attr('stroke-linecap', 'round').attr('d', line);

    // points + tooltips
    g.selectAll('.dot').data(data).join('circle')
        .attr('cx', d => x(d.date))
        .attr('cy', d => ySales(Number(d.salesAmount) || 0))
        .attr('r', 4).attr('fill', '#fff').attr('stroke', primary).attr('stroke-width', 2)
        .append('title').text(d => `${d.date} 销售额 ¥${Number(d.salesAmount).toFixed(2)}`);

    return summary + div.html();
}

document.getElementById('nav').addEventListener('click', function (e) {

    if (!a) return;
    switchMod(a.dataset.mod);
});

function switchMod(mod) {
    currentMod = mod;
    // 离开客服管理页要停掉轮询，否则会在别的页面一直发请求
    if (csTimer) { clearInterval(csTimer); csTimer = null; }
    document.querySelectorAll('#nav a').forEach(x => x.classList.toggle('active', x.dataset.mod === mod));
    document.getElementById('pageTitle').textContent = MODULES[mod].title;
    document.getElementById('content').innerHTML = '<div class="empty">加载中...</div>';
    MODULES[mod].render().catch(err => {
        document.getElementById('content').innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;

// ==================== 通用表格渲染 ====================
function renderPanel(headHtml, bodyHtml) {
    return `<div class="panel"><div class="panel-head">${headHtml}</div><div class="panel-body">${bodyHtml}</div></div>`;
}
function headWith(title, btnHtml) {
    return `<h3>${title}</h3>${btnHtml || ''}`;
}
function tableWrap(html, cls) {
    return `<div class="table-wrap"><table${cls ? ' class="' + cls + '"' : ''}>${html}</table></div>`;
}

// ==================== 仪表盘 ====================
async function renderDashboard() {
    // 退款 / 风险不在 /admin/dashboard 的返回里（该 DTO 只有订单与库存口径），
    // 需要按权限各自单独拉：退款用与「退款管理」同一个 /admin/refunds（保证口径一致），
    // 风险用 /admin/risk/summary。无权限时接口返 403 会 throw，故用 catch 兜底，
    // 否则一个 403 会把整个仪表盘拖垮。
    const canRefund = hasPerm('order:view', 'cs:manage');
    const canRisk = hasPerm('risk:view');
    const [d, c, refunds, risk] = await Promise.all([
        api('/admin/dashboard'),
        api('/admin/dashboard/charts'),
        canRefund ? api('/admin/refunds').catch(() => []) : Promise.resolve([]),
        canRisk ? api('/admin/risk/summary').catch(() => null) : Promise.resolve(null)
    ]);

    // ── 退款信息：与「退款管理」同源（/admin/refunds 全量列表），前端聚合出计数与待退金额 ──
    const refundList = refunds || [];
    const refundByStatus = { PENDING: 0, APPROVED: 0, REJECTED: 0 };
    let refundPendingAmount = 0;
    refundList.forEach(r => {
        if (refundByStatus[r.status] !== undefined) refundByStatus[r.status]++;
        if (r.status === 'PENDING') refundPendingAmount += Number(r.amount || 0);
    });

    // ── 风险订单：/admin/risk/summary → {high, medium, low, unread} ──
    const riskSum = risk || null;
    const riskHigh = (riskSum && riskSum.high) || 0;
    const riskMedium = (riskSum && riskSum.medium) || 0;
    const riskLow = (riskSum && riskSum.low) || 0;
    const riskUnread = (riskSum && riskSum.unread) || 0;

    // 两块面板并排放在 chart-grid 里；只剩一块时让它独占整行
    const bothPanels = canRefund && canRisk;
    const panelCls = 'panel' + (bothPanels ? '' : ' span-full');

    const refundPanel = !canRefund ? '' : `
        <div class="${panelCls}">
            <div class="panel-head">
                <h3>退款信息</h3>
                <button class="btn ghost sm" onclick="switchMod('refunds')">前往处理 →</button>
            </div>
            <div class="panel-body">
                <div class="stat-grid tight">
                    <div class="stat-card"><div class="label">待处理退款</div><div class="value ${refundByStatus.PENDING > 0 ? 'orange' : 'green'}">${refundByStatus.PENDING}</div></div>
                    <div class="stat-card"><div class="label">待退金额</div><div class="value primary money">${fmtMoney(refundPendingAmount)}</div></div>
                    <div class="stat-card"><div class="label">已同意</div><div class="value green">${refundByStatus.APPROVED}</div></div>
                    <div class="stat-card"><div class="label">已拒绝</div><div class="value">${refundByStatus.REJECTED}</div></div>
                </div>
                <div class="hint" style="margin:12px 0 0">
                    累计申请 ${refundList.length} 笔。${refundByStatus.PENDING > 0
                        ? '待处理申请已计入上方「待退金额」；同意退款后才会真正退回款项、回补库存并返还优惠券。'
                        : '当前没有待处理的退款申请。'}
                </div>
            </div>
        </div>`;

    const riskPanel = !canRisk ? '' : `
        <div class="${panelCls}">
            <div class="panel-head">
                <h3>风险订单</h3>
                <button class="btn ghost sm" onclick="switchMod('risk')">前往核查 →</button>
            </div>
            <div class="panel-body">
                <div class="stat-grid tight">
                    <div class="stat-card"><div class="label">高风险</div><div class="value ${riskHigh > 0 ? 'red' : 'green'}">${riskHigh}</div></div>
                    <div class="stat-card"><div class="label">中风险</div><div class="value orange">${riskMedium}</div></div>
                    <div class="stat-card"><div class="label">低风险</div><div class="value blue">${riskLow}</div></div>
                    <div class="stat-card"><div class="label">未读提醒</div><div class="value ${riskUnread > 0 ? 'primary' : 'green'}">${riskUnread}</div></div>
                </div>
                <div class="hint" style="margin:12px 0 0">
                    风险评分由规则引擎（金额异常 / 短时多单 / 敏感地址 / 首单大额 / 凌晨下单）+ AI 综合判断自动生成。
                </div>
            </div>
        </div>`;

    // ── 超时未发货：后端 /admin/dashboard 一并返回（阈值 AdminService.SLA_SHIP_DAYS = 2 天）──
    // 起算时间是付款时间，付款时间缺失时后端退化为下单时间。字段缺失一律按 0 处理，保证向后兼容。
    const overdueCount = d.overdueShipCount || 0;
    const overdueAmount = d.overdueShipAmount || 0;
    const overdueOldest = d.oldestOverdueDays || 0;
    const overdueShips = d.overdueShips || [];

    // 明细面板：只在真的出现超时才渲染，避免空占版面；列表本身就是「提示」要指给人的东西
    const overduePanel = overdueCount === 0 ? '' : `
        <div class="panel" style="margin:22px 0;border-color:var(--destructive)">
            <div class="panel-head">
                <h3>⏰ 超时未发货（付款后超过 ${SLA_SHIP_DAYS} 天仍未发货）</h3>
                <button class="btn ghost sm" onclick="switchMod('orders')">前往发货 →</button>
            </div>
            <div class="panel-body">
                ${tableWrap(`<thead><tr>
                    <th>订单号</th><th>下单用户</th><th>订单金额</th><th>付款时间</th><th>已等待</th>
                </tr></thead>
                <tbody>${overdueShips.map(s => `
                    <tr>
                        <td>${esc(s.orderNo || '-')}</td>
                        <td>${esc(s.userName || '-')}</td>
                        <td><b>${fmtMoney(s.payAmount)}</b></td>
                        <td>${fmtTime(s.paidAt)}</td>
                        <td><span class="badge ${s.waitingDays >= 3 ? 'red' : 'orange'}">${s.waitingDays} 天</span></td>
                    </tr>`).join('')}</tbody>`)}
                <div class="hint" style="margin:12px 0 0">
                    共 <b>${overdueCount}</b> 笔超时订单，合计 <b>${fmtMoney(overdueAmount)}</b>${overdueCount > overdueShips.length
                        ? `；上表仅列出等待最久的 ${overdueShips.length} 笔，完整列表请到「订单管理」查看。`
                        : '。'}
                </div>
            </div>
        </div>`;

    // ── 运营提示：在原有「待发货 / 低库存」之外，补上退款与风险两条提醒（按权限显示）──
    const opTips = [
        d.pendingShipCount > 0
            ? `<li>有 <b style="color:var(--warning-strong)">${d.pendingShipCount}</b> 笔订单待发货，请及时处理。</li>`
            : '<li>暂无待发货订单 <span class="badge green">正常</span></li>',
        overdueCount > 0
            ? `<li>其中 <b style="color:var(--destructive)">${overdueCount}</b> 笔已超时未发货（付款超过 ${SLA_SHIP_DAYS} 天，最久 <b style="color:var(--destructive)">${overdueOldest}</b> 天，合计 ${fmtMoney(overdueAmount)}），请尽快发货。</li>`
            : `<li>待发货订单均在 ${SLA_SHIP_DAYS} 天时效内，暂无超时未发货 <span class="badge green">正常</span></li>`,
        d.lowStockCount > 0
            ? `<li>有 <b style="color:var(--destructive)">${d.lowStockCount}</b> 件商品库存偏低（≤${LOW_STOCK_THRESHOLD}），请到「库存管理」及时补货。</li>`
            : '<li>库存健康，无低库存商品 <span class="badge green">正常</span></li>'
    ];
    if (canRefund) {
        opTips.push(refundByStatus.PENDING > 0
            ? `<li>有 <b style="color:var(--warning-strong)">${refundByStatus.PENDING}</b> 笔退款申请待处理（合计 <b>${fmtMoney(refundPendingAmount)}</b>），请到「退款管理」及时审核。</li>`
            : '<li>暂无待处理退款申请 <span class="badge green">正常</span></li>');
    }
    if (canRisk) {
        opTips.push(riskUnread > 0
            ? `<li>有 <b style="color:var(--destructive)">${riskUnread}</b> 条风险订单提醒未读，其中高风险 <b style="color:var(--destructive)">${riskHigh}</b> 条，请到「风险监控」核查并标记已读。</li>`
            : '<li>风险提醒均已读，暂无待核查风险订单 <span class="badge green">正常</span></li>');
    }
    opTips.push('<li>促销、物流等完整运营能力已就绪，可通过左侧菜单操作。</li>');

    document.getElementById('content').innerHTML = `
        <div class="stat-grid">
            <div class="stat-card"><div class="label">会员总数</div><div class="value blue">${d.userCount}</div></div>
            <div class="stat-card"><div class="label">商品总数</div><div class="value">${d.productCount}</div></div>
            <div class="stat-card"><div class="label">订单总数</div><div class="value">${d.orderCount}</div></div>
            <div class="stat-card"><div class="label">累计销售额</div><div class="value primary">${fmtMoney(d.totalSales)}</div></div>
            <div class="stat-card"><div class="label">待付款</div><div class="value orange">${d.pendingPaymentCount}</div></div>
            <div class="stat-card"><div class="label">待发货</div><div class="value orange">${d.pendingShipCount}</div></div>
            <div class="stat-card">
                <div class="label">超时未发货</div>
                <div class="value ${overdueCount > 0 ? 'red' : 'green'}">${overdueCount}</div>
                ${overdueCount > 0 ? `<div class="trend">最久 ${overdueOldest} 天 · ${fmtMoney(overdueAmount)}</div>` : '<div class="trend">时效正常</div>'}
            </div>
            <div class="stat-card"><div class="label">待收货</div><div class="value blue">${d.shippedCount}</div></div>
            <div class="stat-card"><div class="label">已完成</div><div class="value green">${d.completedCount}</div></div>
            <div class="stat-card"><div class="label">评论总数</div><div class="value">${d.reviewCount}</div></div>
            <div class="stat-card"><div class="label">低库存商品</div><div class="value ${d.lowStockCount > 0 ? 'red' : 'green'}">${d.lowStockCount}</div></div>
        </div>

        ${overduePanel}

        ${(refundPanel || riskPanel) ? `<div class="chart-grid" style="margin:22px 0">${refundPanel}${riskPanel}</div>` : ''}

        <div class="panel" style="margin:22px 0">
            <div class="panel-head"><h3>运营提示</h3></div>
            <div class="panel-body">
                <ul style="padding-left:20px;line-height:2.2;color:var(--text-600);font-size:14px;">
                    ${opTips.join('')}
                </ul>
            </div>
        </div>

        <div class="panel" style="margin:22px 0">
            <div class="panel-head"><h3>快捷操作</h3></div>
            <div class="panel-body">
                <div class="toolbar" style="margin-bottom:0">
                    <button class="btn primary" onclick="switchMod('orders')">📦 处理待发货 (${d.pendingShipCount})</button>
                    ${overdueCount > 0 ? `<button class="btn danger" onclick="switchMod('orders')">⏰ 超时未发货 (${overdueCount})</button>` : ''}
                    <button class="btn secondary" onclick="switchMod('stock')">📉 库存预警 (${d.lowStockCount})</button>
                    <button class="btn secondary" onclick="switchMod('risk')">🛡️ 风险监控</button>
                    <button class="btn secondary" onclick="switchMod('promotions')">🏷️ 促销活动</button>
                    <button class="btn ghost" onclick="switchMod('reviews')">💬 评论管理</button>
                </div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="panel span-full">
                <div class="panel-head"><h3>近 7 天销售趋势</h3></div>
                <div class="panel-body">${trendChart(c.salesTrend)}</div>
            </div>
            <div class="panel">
                <div class="panel-head"><h3>订单状态分布</h3></div>
                <div class="panel-body">${donutChart(c.orderStatusDist, { centerLabel: '订单' })}</div>
            </div>
            <div class="panel">
                <div class="panel-head"><h3>支付方式分布</h3></div>
                <div class="panel-body">${donutChart(c.paymentDist, { centerLabel: '笔数' })}</div>
            </div>
            <div class="panel span-full">
                <div class="panel-head">
                    <h3>分类商品分布（按一级分类）</h3>
                    <span style="font-size:12px;color:var(--muted-foreground)">
                        口径：全部商品（含下架）按所属<b>一级分类</b>上卷统计，各条之和 = 上方「商品总数」
                    </span>
                </div>
                <div class="panel-body">${hbarChart(c.categoryDist)}</div>
            </div>
        </div>`;
}

// ==================== 商品管理 ====================
async function renderProducts() {
    const cats = await api('/admin/categories');
    const products = await api('/admin/products');
    const catMap = {};
    cats.forEach(c => catMap[c.id] = c.name);

    document.getElementById('content').innerHTML = renderPanel(
        headWith('商品管理', `<button class="btn primary sm" id="addProduct">+ 新增商品</button>`),
        `<div class="toolbar"><input id="pSearch" placeholder="搜索商品名称..." style="width:240px"></div>
         ${tableWrap(`<thead><tr><th>ID</th><th>商品</th><th>分类</th><th>价格</th><th>库存</th><th>销量</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="pRows"></tbody>`)}`
    );

    function draw(list) {
        document.getElementById('pRows').innerHTML = list.map(p => `
            <tr>
                <td>${p.id}</td>
                <td><b>${esc(p.name)}</b><span class="cell-meta">${esc(p.subtitle || '')}</span></td>
                <td>${esc(catMap[p.categoryId] || p.categoryId)}</td>
                <td>${fmtMoney(p.price)}${p.originalPrice ? `<span class="cell-meta"><s>${fmtMoney(p.originalPrice)}</s></span>` : ''}</td>
                <td>${p.stock}</td>
                <td>${p.sales}</td>
                <td>${p.status === 1 ? '<span class="badge green">上架</span>' : '<span class="badge gray">下架</span>'}</td>
                <td><div class="ops">
                    <button class="btn ghost sm" onclick="editProduct(${p.id})">编辑</button>
                    <button class="btn ghost sm" onclick="adjustStock(${p.id})">库存</button>
                    <button class="btn danger sm" onclick="delProduct(${p.id})">删除</button>
                </div></td>
            </tr>`).join('') || '<tr><td colspan="8" class="empty">暂无商品</td></tr>';
    }
    draw(products);

    document.getElementById('pSearch').addEventListener('input', e => {
        const kw = e.target.value.trim().toLowerCase();
        draw(products.filter(p => (p.name || '').toLowerCase().includes(kw) || (p.subtitle || '').toLowerCase().includes(kw)));
    });
    document.getElementById('addProduct').onclick = () => openProductModal(null, cats, catMap, reload);
    window.editProduct = id => openProductModal(products.find(p => p.id === id), cats, catMap, reload);
    window.delProduct = async id => {
        if (!confirm('确定删除该商品？')) return;
        await api('/admin/products/' + id, 'DELETE'); toast('已删除'); reload();
    };
    window.adjustStock = id => openStockModal(products.find(p => p.id === id), reload);

    function reload() { switchMod('products'); }
}

    const catOptions = cats.map(c => `<option value="${c.id}" ${p && p.categoryId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
    openModal(isEdit ? '编辑商品' : '新增商品', `
        <div class="form-row"><label>商品名称 *</label><input id="fName" value="${esc(p ? p.name : '')}" placeholder="如：红富士苹果"></div>
        <div class="form-row">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
                <label style="margin:0">副标题/卖点</label>
                <button type="button" class="btn ghost sm" onclick="aiCopyToggle('aiProdPanel')">✨ AI 帮我写</button>
            </div>
            <input id="fSubtitle" value="${esc(p ? p.subtitle : '')}" placeholder="如：脆甜多汁 产地直供">
        </div>
        <div class="form-row two">
            <div><label>分类 *</label><select id="fCat">${catOptions}</select></div>
            <div><label>计量单位</label><input id="fUnit" value="${esc(p ? p.unit || '件' : '件')}"></div>
        </div>
        <div class="form-row two">
            <div><label>现价（元）*</label><input id="fPrice" type="number" step="0.01" value="${p ? p.price : ''}"></div>
            <div><label>原价（元）</label><input id="fOrigPrice" type="number" step="0.01" value="${p && p.originalPrice ? p.originalPrice : ''}"></div>
        </div>
        <div class="form-row two">
            <div><label>库存 *</label><input id="fStock" type="number" value="${p ? p.stock : 0}"></div>
            <div><label>状态</label><select id="fStatus">
                <option value="1" ${!p || p.status === 1 ? 'selected' : ''}>上架</option>
                <option value="0" ${p && p.status === 0 ? 'selected' : ''}>下架</option>
            </select></div>
        </div>

const RISK_LEVEL = {
    HIGH:   { label: '高风险', className: 'risk-badge HIGH' },
    MEDIUM: { label: '中风险', className: 'risk-badge MEDIUM' },
    LOW:    { label: '低风险', className: 'risk-badge LOW' }
};
function riskBadgeOf(level) {
    if (!level) return '<span class="risk-badge NONE">未扫描</span>';
    const cfg = RISK_LEVEL[level];
    if (!cfg) return `<span class="risk-badge NONE">${level}</span>`;
    return `<span class="${cfg.className}">${cfg.label}</span>`;
}

async function renderOrders() {
    document.getElementById('content').innerHTML = renderPanel(
        headWith('订单管理'),
        `<div class="toolbar">
            <select id="oFilter"><option value="">全部状态</option>
                ${Object.entries(ORDER_STATUS).map(([k,v]) => `<option value="${k}">${v[0]}</option>`).join('')}
            </select>

                <option value="">全部风险</option>
                <option value="HIGH">🔴 高风险</option>

            </select>
            <button class="btn ghost sm" id="oBatchScan">🔍 批量风险扫描</button>
         </div>
         ${tableWrap(`<thead><tr><th>订单号</th><th>金额</th><th>状态</th><th>风险</th><th>收货人</th><th>下单时间</th><th>操作</th></tr></thead>
            <tbody id="oRows"></tbody>`)}`
    );

    let all = await api('/admin/orders');
    function draw(list) {
        document.getElementById('oRows').innerHTML = list.map(o => `
            <tr>
                <td>${esc(o.orderNo)}</td>
                <td>${fmtMoney(o.payAmount)}${o.discountAmount > 0 ? `<span class="cell-meta" style="color:var(--destructive)">优惠 -${fmtMoney(o.discountAmount)}</span>` : ''}</td>
                <td>${statusBadge(o.status, ORDER_STATUS)}</td>
                <td>
                    ${riskBadgeOf(o.riskLevel)}
                    ${o.riskScore != null ? `<span class="cell-meta">${o.riskScore} 分</span>` : ''}
                </td>
                <td>${esc(o.receiverName || '-')}<span class="cell-meta">${esc(o.receiverPhone || '')}</span></td>
                <td>${fmtTime(o.createdAt)}</td>
                <td><div class="ops">
                    <button class="btn ghost sm" onclick="viewOrder(${o.id})">详情</button>
                    ${o.status === 'PAID' ? `<button class="btn primary sm" onclick="shipOrder(${o.id})">发货</button>` : ''}
                    <button class="btn ghost sm" onclick="scanSingleOrder(${o.id})" title="对该订单重新跑风险扫描">🔍 扫描</button>
                </div></td>
            </tr>`).join('') || '<tr><td colspan="7" class="empty">暂无订单</td></tr>';
        window._orders = all;
    }
    draw(all);

    document.getElementById('oFilter').onchange = async e => {
        const s = e.target.value;
        all = await api('/admin/orders' + (s ? '?status=' + s : ''));
        applyOrderFilters();
    };
    document.getElementById('oRiskFilter').onchange = () => applyOrderFilters();
    document.getElementById('oBatchScan').onclick = batchScanOrders;

    function applyOrderFilters() {
        const r = document.getElementById('oRiskFilter').value;
        if (!r) return draw(all);
        let filtered;
        if (r === 'UNSCANNED') filtered = all.filter(o => !o.riskLevel);
        else filtered = all.filter(o => o.riskLevel === r);
        draw(filtered);
    }

    window.scanSingleOrder = async id => {
        if (!hasPerm('risk:scan')) return toast('无 risk:scan 权限', true);
        try {
            const dto = await api('/admin/risk/orders/' + id + '/scan', 'POST');
            toast('扫描完成：' + dto.level + '（' + dto.score + ' 分）');
            all = await api('/admin/orders');
            applyOrderFilters();
        } catch (e) { toast(e.message, true); }
    };

    async function batchScanOrders() {
        if (!hasPerm('risk:scan')) return toast('无 risk:scan 权限', true);
        const btn = document.getElementById('oBatchScan');
        btn.disabled = true; btn.textContent = '⏳ 扫描中...';
        try {
            const data = await api('/admin/risk/orders/batch-scan?limit=30', 'POST');
            toast('已扫描 ' + data.scanned + ' 条订单');
            all = await api('/admin/orders');
            applyOrderFilters();
            refreshRiskUnread();
        } catch (e) { toast(e.message, true); }
        btn.disabled = false; btn.textContent = '🔍 批量风险扫描';
    }

    window.shipOrder = id => {
        const companyOptions = SHIP_COMPANIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        openModal('订单发货', `
            <div class="form-row"><label>物流公司 *</label><select id="fCompany">${companyOptions}</select></div>
            <div class="form-row"><label>运单号 *</label>
                <div style="display:flex;gap:10px">
                    <input id="fTracking" readonly style="flex:1;background:var(--bg-100);color:var(--muted-foreground)">
                    <button type="button" class="btn ghost sm" id="fRegen">换一个</button>
                </div>
                <div class="hint">运单号已按所选物流公司随机生成，可点击「换一个」重新生成</div>
            </div>
            <div class="form-row"><label>备注</label><input id="fRemark" placeholder="可选"></div>
        `, async () => {
            const company = document.getElementById('fCompany').value;
            const trackingNo = document.getElementById('fTracking').value.trim();
            if (!trackingNo) return toast('请生成运单号', true);
            await api('/admin/orders/' + id + '/ship', 'PUT', { company, trackingNo, remark: document.getElementById('fRemark').value.trim() });
            toast('已发货'); switchMod('orders');
        });

        const fCompany = document.getElementById('fCompany');
        const fTracking = document.getElementById('fTracking');
        const refreshTracking = () => { fTracking.value = genTrackingNo(fCompany.value); };
        refreshTracking();
        fCompany.onchange = refreshTracking;
        document.getElementById('fRegen').onclick = refreshTracking;
    };
    window.viewOrder = id => {
        const o = window._orders.find(x => x.id === id);
        if (!o) return;
        const items = (o.items || []).map(i => `<tr><td>${esc(i.productName)}</td><td>${fmtMoney(i.price)}</td><td>${i.quantity}</td><td>${fmtMoney(i.subtotal)}</td></tr>`).join('');
        openModal('订单详情 ' + o.orderNo, `
            <div style="font-size:13px;line-height:2.2;color:var(--text-600)">
                <div>状态：${statusBadge(o.status, ORDER_STATUS)}</div>
                <div>商品总额：${fmtMoney(o.totalAmount)}　优惠：-${fmtMoney(o.discountAmount)}　<b style="color:var(--foreground)">实付：${fmtMoney(o.payAmount)}</b></div>
                <div>收货人：${esc(o.receiverName || '-')}　${esc(o.receiverPhone || '')}</div>
                <div>收货地址：${esc(o.receiverAddress || '-')}</div>
                ${o.remark ? `<div>备注：${esc(o.remark)}</div>` : ''}
                <div>下单：${fmtTime(o.createdAt)}　支付：${fmtTime(o.paidAt)}　发货：${fmtTime(o.shippedAt)}　完成：${fmtTime(o.completedAt)}</div>
            </div>
            ${tableWrap(`<thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody>${items}</tbody>`)}
        `, null, true);
    };
}

// ==================== 退款管理 ====================
// 用户在前台「退款/售后」提交申请 → 订单置 REFUNDING（退款中，钱不退）→ 商家在这里审核。
// 点「同意退款」才真正执行退回：回补库存与销量、返还优惠券、支付流水置已退款、订单置已退款。
// 点「拒绝」则把订单恢复到申请前的状态（后端 previousStatus），用户可继续正常收货/评价。
const REFUND_STATUS = { PENDING:['待处理','orange'], APPROVED:['已同意','green'], REJECTED:['已拒绝','gray'] };

/** 侧边栏「退款管理」待处理红点。 */
async function refreshRefundUnread() {
    const badge = document.getElementById('refundUnreadBadge');
    if (!badge) return;
    if (!hasPerm('order:view', 'cs:manage')) { badge.style.display = 'none'; return; }
    try {
        const s = await api('/admin/refunds/pending-count');
        const n = (s && s.pending) || 0;
        badge.textContent = n > 99 ? '99+' : n;
        badge.style.display = n > 0 ? 'inline-block' : 'none';
    } catch (e) {
        // 静默：红点失败不该打扰使用
    }
}

async function renderRefunds() {
    document.getElementById('content').innerHTML = renderPanel(
        headWith('退款管理'),
        `<div class="toolbar">
            <select id="rFilter"><option value="">全部状态</option>
                ${Object.entries(REFUND_STATUS).map(([k,v]) => `<option value="${k}">${v[0]}</option>`).join('')}
            </select>
            <span style="align-self:center;font-size:12px;color:var(--muted-foreground)">
                同意退款会同时回补库存、返还优惠券，并把支付流水置为「已退款」</span>
         </div>
         ${tableWrap(`<thead><tr><th>订单号</th><th>申请人</th><th>退款金额</th><th>商品</th><th>退款原因</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="rRows"></tbody>`)}`
    );

    async function load(status) {
        const list = await api('/admin/refunds' + (status ? '?status=' + status : ''));
        window._refunds = list;
        document.getElementById('rRows').innerHTML = list.map(r => `
            <tr>
                <td>${esc(r.orderNo || '-')}</td>
                <td>${esc(r.userName || '-')}<span class="cell-meta">${esc(r.userPhone || '')}</span></td>
                <td><b>${fmtMoney(r.amount)}</b></td>
                <td>${esc(r.products || '-')}</td>
                <td>${esc(r.reason || '-')}${r.rejectReason ? `<span class="cell-meta" style="color:var(--destructive)">拒绝理由：${esc(r.rejectReason)}</span>` : ''}</td>
                <td>${fmtTime(r.createdAt)}</td>
                <td>${statusBadge(r.status, REFUND_STATUS)}
                    ${r.status === 'PENDING' && r.previousStatusLabel ? `<span class="cell-meta">申请前：${esc(r.previousStatusLabel)}</span>` : ''}</td>
                <td><div class="ops">
                    ${r.status === 'PENDING'
                        ? `<button class="btn primary sm" onclick="approveRefund(${r.id})">同意退款</button>
                           <button class="btn danger sm" onclick="rejectRefund(${r.id})">拒绝</button>`
                        : '<span class="cell-meta">已处理</span>'}
                </div></td>
            </tr>`).join('') || '<tr><td colspan="8" class="empty">暂无退款申请</td></tr>';
    }
    await load('');
    document.getElementById('rFilter').onchange = e => load(e.target.value);

    window.approveRefund = async id => {
        const r = (window._refunds || []).find(x => x.id === id);
        if (!confirm(`确认同意退款 ${fmtMoney(r ? r.amount : 0)}？\n\n同意后将回补库存、返还优惠券，并把支付流水置为「已退款」，操作不可撤销。`)) return;
        try {
            await api('/admin/refunds/' + id + '/approve', 'POST');
            toast('已同意退款，款项已退回');
            await load(document.getElementById('rFilter').value);
            refreshRefundUnread();
        } catch (e) { toast(e.message, true); }
    };

    window.rejectRefund = id => {
        openModal('拒绝退款申请', `
            <div class="form-row"><label>拒绝理由 *</label>
                <input id="fRejectReason" placeholder="如：商品已发出，请收到后申请退货">
                <div class="hint">拒绝后订单会恢复到申请前的状态，用户可继续正常收货 / 评价。</div>
            </div>
        `, async () => {
            const reason = document.getElementById('fRejectReason').value.trim();
            if (!reason) return toast('请填写拒绝理由', true);
            await api('/admin/refunds/' + id + '/reject', 'POST', { reason });
            toast('已拒绝该退款申请');
            await load(document.getElementById('rFilter').value);
            refreshRefundUnread();
        });
    };
}

async function renderMembers() {
    const users = await api('/admin/users');
    document.getElementById('content').innerHTML = renderPanel(
        headWith('会员管理'),
        `<div class="toolbar"><input id="mSearch" placeholder="搜索用户名/昵称..." style="width:240px"></div>

            const roleBadge = roleBadgeOf(u.role);

            <tr>
                <td>${u.id}</td><td>${esc(u.username)}</td><td>${esc(u.nickname || '-')}</td><td>${esc(u.phone || '-')}</td>
                <td>${roleBadge}</td>
                <td>${u.status === 1 ? '<span class="badge green">正常</span>' : '<span class="badge gray">禁用</span>'}</td>
                <td>${fmtTime(u.createdAt)}</td>
                <td><div class="ops">
                    ${hasRole('ADMIN') ? `<button class="btn ghost sm" onclick="toggleUser(${u.id}, ${u.status})">${u.status === 1 ? '禁用' : '启用'}</button>` : ''}
                    ${hasRole('ADMIN') ? `<button class="btn ghost sm" onclick="openChangeRole(${u.id}, '${u.role}')">切换角色</button>` : ''}
                    ${!hasRole('ADMIN') ? '<span class="text-muted" style="font-size:12px">（只读）</span>' : ''}
                </div></td>
            </tr>`;
        }).join('') || '<tr><td colspan="8" class="empty">暂无用户</td></tr>';
    }
    draw(users);
    document.getElementById('mSearch').addEventListener('input', e => {
        const kw = e.target.value.trim().toLowerCase();
        draw(users.filter(u => (u.username || '').toLowerCase().includes(kw) || (u.nickname || '').toLowerCase().includes(kw)));
    });
    window.toggleUser = async (id, cur) => { await api('/admin/users/' + id + '/status', 'PUT', { status: cur === 1 ? 0 : 1 }); toast('已更新'); switchMod('members'); };
    window.openChangeRole = (id, cur) => {
        const user = (users || []).find(x => x.id === id);
        const userLabel = user ? (user.username + (user.nickname ? '（' + user.nickname + '）' : '')) : ('#' + id);
        const roles = [
            { v: 'USER',  label: '普通用户' },
            { v: 'OPS',   label: '运营专员' },
            { v: 'CS',    label: '客服' },
            { v: 'ADMIN', label: '超级管理员' }
        ];
        const radios = roles.map(r => `
            <label class="form-row inline" style="padding:4px 0">
                <input type="radio" name="rolePick" value="${r.v}" ${r.v === cur ? 'checked' : ''}>
                <span>${r.label}</span>
                ${r.v === cur ? '<span class="text-muted" style="font-size:12px">（当前）</span>' : ''}
            </label>`).join('');
        const html = `
            <div class="hint" style="margin-bottom:12px">
                为用户 <b>${esc(userLabel)}</b> 选择新角色（立即生效，下次请求即按新角色鉴权）
            </div>
            <form id="rolePickForm" style="display:flex;flex-direction:column;gap:2px">${radios}</form>`;
        openModal('切换用户角色', html, async () => {
            const v = (document.querySelector('input[name="rolePick"]:checked') || {}).value;
            if (!v) { toast('请选择角色', true); return; }
            if (v === 'ADMIN' && cur !== 'ADMIN') {
                if (!confirm(`⚠️ 确认将「${userLabel}」升级为「超级管理员」？\n该操作将授予该账号全部管理权限（包括编辑/删除商品、修改其他用户角色等高危操作）。`)) return;
            } else if (v !== 'ADMIN' && cur === 'ADMIN') {
                if (!confirm(`⚠️ 确认将「${userLabel}」从「超级管理员」降级为「${roleLabel(v)}」？\n该账号将立即失去全部管理权限（系统会校验至少保留 1 名管理员）。`)) return;
            }
            try {
                await api('/admin/users/' + id + '/role', 'PUT', { role: v });
                toast('角色已更新为 ' + roleLabel(v));
                closeModal();
                switchMod('members');
            } catch (e) { toast(e.message, true); }
        }, false, '保存', '取消');
    };
}

        const r = roles.find(x => x.id === id);

    window.delRole = async (id, code) => {
        if (!confirm('确认删除角色「' + code + '」？将同时解除其全部权限关联（请确保已无用户使用该角色）。')) return;
        try { await api('/admin/rbac/roles/' + id, 'DELETE'); toast('已删除'); renderRoles(); }

    function openRoleForm(r, allPerms) {
        const isEdit = !!r;
        const fields = `
            <div class="form-row"><label>编码</label><input id="r_code" value="${esc(r?.code || '')}" ${isEdit ? 'disabled placeholder="编码不可修改"' : 'placeholder="如 ADMIN / OPS / CS / USER"'}></div>

            <div class="form-row"><label>描述</label><input id="r_desc" value="${esc(r?.description || '')}" placeholder="角色用途说明"></div>
            <div class="form-row two">
                <div><label>排序</label><input id="r_sort" type="number" value="${r?.sortOrder ?? 0}"></div>
                <div><label>数据范围</label>
                    <select id="r_scope">
                        <option value="ALL"  ${(r?.dataScope || 'ALL') === 'ALL' ? 'selected' : ''}>全部 (ALL)</option>
                        <option value="DEPT" ${r?.dataScope === 'DEPT' ? 'selected' : ''}>本部门 (DEPT)</option>
                        <option value="SELF" ${r?.dataScope === 'SELF' ? 'selected' : ''}>仅本人 (SELF)</option>
                    </select>
                </div>
            </div>
            <div class="form-row"><label>状态</label>
                <select id="r_status">
                    <option value="1" ${(r?.status ?? 1) === 1 ? 'selected' : ''}>启用</option>
                    <option value="0" ${r?.status === 0 ? 'selected' : ''}>禁用</option>
                </select>
            </div>`;
        openModal(isEdit ? '编辑角色' : '新增角色', fields, async () => {
            const body = {
                code: document.getElementById('r_code').value.trim(),
                name: document.getElementById('r_name').value.trim(),
                description: document.getElementById('r_desc').value.trim(),
                sortOrder: Number(document.getElementById('r_sort').value) || 0,
                dataScope: document.getElementById('r_scope').value,
                status: Number(document.getElementById('r_status').value)
            };
            if (!body.name) { toast('请输入名称', true); return; }
            try {
                if (isEdit) await api('/admin/rbac/roles/' + r.id, 'PUT', body);
                else await api('/admin/rbac/roles', 'POST', body);
                toast('已保存'); closeModal(); renderRoles();
            } catch (e) { toast(e.message, true); }
        }, false, '保存', '取消');
    }

    window.openRolePerms = async (roleId, roleName) => {
        let assigned = [];
        try { assigned = Array.from(await api('/admin/rbac/roles/' + roleId + '/permissions')); }
        catch (e) { toast('获取已分配权限失败：' + e.message, true); return; }
        const set = new Set(assigned);
        const byMod = {};
        for (const p of perms) {
            (byMod[p.module || '其他'] = byMod[p.module || '其他'] || []).push(p);
        }
        const groups = Object.entries(byMod).map(([mod, list]) => `
            <fieldset style="border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:12px">
                <legend style="padding:0 8px;color:var(--muted-foreground);font-size:12px;font-weight:600">${esc(mod)}</legend>
                ${list.map(p => `
                    <label class="form-row inline" style="margin:4px 16px 4px 0;font-size:13px">
                        <input type="checkbox" name="permPick" value="${p.id}" ${set.has(p.id) ? 'checked' : ''}>
                        <span>${esc(p.name)}</span>
                        <span class="text-muted" style="font-size:11px">${esc(p.code)}</span>
                    </label>`).join('')}
            </fieldset>`).join('');
        const html = `
            <div class="hint" style="margin-bottom:12px">
                为角色 <b>${esc(roleName)}</b> 分配权限（勾选即生效，覆盖现有全部授权）
            </div>
            <form id="permPickForm">${groups}</form>
            <div style="margin-top:10px"><button type="button" class="btn ghost sm" id="selAll">全选</button>
            <button type="button" class="btn ghost sm" id="selNone">清空</button></div>`;
        openModal('分配权限 · ' + roleName, html, async () => {
            const ids = Array.from(document.querySelectorAll('input[name="permPick"]:checked')).map(x => Number(x.value));
            try {
                await api('/admin/rbac/roles/' + roleId + '/permissions', 'PUT', { permissionIds: ids });
                toast('已保存「' + roleName + '」共 ' + ids.length + ' 项权限');
                closeModal(); renderRoles();
            } catch (e) { toast(e.message, true); }
        }, false, '保存', '取消');
        document.getElementById('selAll').onclick = () => document.querySelectorAll('input[name="permPick"]').forEach(x => x.checked = true);
        document.getElementById('selNone').onclick = () => document.querySelectorAll('input[name="permPick"]').forEach(x => x.checked = false);
    };
}

// ==================== 风险监控 ====================
async function refreshRiskUnread() {
    const badge = document.getElementById('riskUnreadBadge');
    if (!badge) return;
    if (!hasPerm('risk:view')) { badge.style.display = 'none'; return; }
    try {
        const summary = await api('/admin/risk/summary');
        const n = summary.unread || 0;
        if (n > 0) {
            badge.textContent = n > 99 ? '99+' : n;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    } catch (e) { }
}

async function renderRisk() {
    const summary = await api('/admin/risk/summary');
    const overview = `
        <div class="risk-overview">
            <div class="stat high"><div class="num">${summary.high || 0}</div><div class="lbl">🔴 高风险</div></div>
            <div class="stat medium"><div class="num">${summary.medium || 0}</div><div class="lbl">🟠 中风险</div></div>
            <div class="stat low"><div class="num">${summary.low || 0}</div><div class="lbl">🟢 低风险</div></div>
            <div class="stat unread"><div class="num">${summary.unread || 0}</div><div class="lbl">📩 未读</div></div>
        </div>`;

    document.getElementById('content').innerHTML = renderPanel(
        headWith('风险监控'),
        `<div class="hint" style="margin-bottom:14px">
            自动对新订单跑风险评分：规则引擎（金额异常/短时多单/地址敏感词/首单大额/凌晨下单）+ DeepSeek 综合判断。
            失败的扫描会回退到规则结果，不影响核心风控。
        </div>
        <div class="toolbar">
            <select id="rLevel">
                <option value="ALL">全部等级</option>
                <option value="HIGH">🔴 高风险</option>
                <option value="MEDIUM">🟠 中风险</option>
                <option value="LOW">🟢 低风险</option>
            </select>
            <button class="btn primary sm" id="rBatchScan">🔍 批量扫描最近订单</button>
            <button class="btn ghost sm" id="rMarkAllRead"
                title="${(summary.unread || 0) > 0 ? '把当前所有未读风险消息标记为已读（不改分数与等级）' : '当前没有未读风险消息'}"
                ${(summary.unread || 0) > 0 ? '' : 'disabled'}>✅ 全部标为已读</button>
        </div>` + overview +
        `${tableWrap(`<thead><tr>
                <th>评分</th><th>等级</th><th>建议</th><th>来源</th><th>订单编号</th><th>扫描时间</th><th>操作</th>
            </tr></thead>
            <tbody id="rRows"></tbody>`)}`
    );

    let all = await api('/admin/risk/scores');

    function draw(list) {
        document.getElementById('rRows').innerHTML = list.map(r => `
            <tr ${r.isRead ? '' : 'style="background:var(--brand-50)"'}>
                <td><b style="color:${r.level === 'HIGH' ? 'var(--destructive)' : r.level === 'MEDIUM' ? 'var(--warning-strong)' : 'var(--success-500)'}">${r.score}</b></td>
                <td>${riskBadgeOf(r.level)}${r.isRead ? '' : ' <span style="color:var(--destructive);font-size:11px">●</span>'}</td>
                <td>${esc(r.suggestedAction || '-')}</td>
                <td><span style="font-size:11px;color:var(--muted-foreground)">${r.source}</span></td>
                <td>${esc(r.orderNo || ('#' + r.orderId))}</td>
                <td>${fmtTime(r.createdAt)}</td>
                <td><div class="ops">
                    <button class="btn ghost sm" onclick="viewRiskDetail(${r.id})">详情</button>
                    ${!r.isRead ? `<button class="btn ghost sm" onclick="markRiskRead(${r.id})">标已读</button>` : ''}
                </div></td>
            </tr>`).join('') || '<tr><td colspan="7" class="empty">暂无风险评分，点击右上「批量扫描」即可对最近 30 天订单跑一轮</td></tr>';
    }
    draw(all);

    document.getElementById('rLevel').onchange = async e => {
        const v = e.target.value;
        all = await api('/admin/risk/scores' + (v !== 'ALL' ? '?level=' + v : ''));
        draw(all);
    };
    document.getElementById('rBatchScan').onclick = async () => {
        if (!hasPerm('risk:scan')) return toast('无 risk:scan 权限', true);
        const btn = document.getElementById('rBatchScan');
        btn.disabled = true; btn.textContent = '⏳ 扫描中...';
        try {
            const data = await api('/admin/risk/orders/batch-scan?limit=30', 'POST');
            toast('已扫描 ' + data.scanned + ' 条订单');
            const v = document.getElementById('rLevel').value;
            all = await api('/admin/risk/scores' + (v !== 'ALL' ? '?level=' + v : ''));
            draw(all);
            renderRisk._refreshOverview();
            refreshRiskUnread();
        } catch (e) { toast(e.message, true); }
        btn.disabled = false; btn.textContent = '🔍 批量扫描最近订单';
    };

    /**
     * 「全部标为已读」：把所有未读风险消息一次性标记为已读（不改分数与等级）。
     * 只写审计，不做幂等；无未读时按钮保持 disabled。批量操作不弹二次确认框。
     */
    document.getElementById('rMarkAllRead').onclick = async () => {
        if (!hasPerm('risk:view')) return toast('无 risk:view 权限', true);
        const btn = document.getElementById('rMarkAllRead');
        if (!btn || btn.disabled) return;
        btn.disabled = true;
        btn.textContent = '⏳ 处理中...';
        // 服务端返回的剩余未读数；null 表示请求/刷新异常导致结果未知
        let remainingUnread = null;
        try {
            const data = await api('/admin/risk/scores/read-all', 'PUT', { level: 'ALL' });
            remainingUnread = (data && typeof data.remainingUnread === 'number') ? data.remainingUnread : 0;
            const affected = (data && typeof data.affected === 'number') ? data.affected : 0;
            toast((data && data.message) ? data.message : ('已把 ' + affected + ' 条标记为已读'));
            const v = document.getElementById('rLevel').value;
            all = await api('/admin/risk/scores' + (v !== 'ALL' ? '?level=' + v : ''));
            draw(all);
            renderRisk._refreshOverview();
            refreshRiskUnread();
        } catch (e) {
            toast(e.message, true);
        } finally {
            // 无论成功失败都不能让按钮卡在「处理中」
            btn.textContent = '✅ 全部标为已读';
            let left = (typeof remainingUnread === 'number') ? remainingUnread : null;
            if (left === null) {
                // 结果未知时用最新概览兜底；概览也拉不到则保守放行（允许重试，避免误锁死）
                try {
                    const s = await api('/admin/risk/summary');
                    left = s.unread || 0;
                } catch (e2) { left = 1; }
            }
            const empty = left <= 0;
            btn.disabled = empty;
            btn.title = empty ? '当前没有未读风险消息' : '把当前所有未读风险消息标记为已读（不改分数与等级）';
        }
    };

    renderRisk._refreshOverview = async () => {
        const summary = await api('/admin/risk/summary');
        document.querySelector('.risk-overview').outerHTML = `
            <div class="risk-overview">
                <div class="stat high"><div class="num">${summary.high || 0}</div><div class="lbl">🔴 高风险</div></div>
                <div class="stat medium"><div class="num">${summary.medium || 0}</div><div class="lbl">🟠 中风险</div></div>
                <div class="stat low"><div class="num">${summary.low || 0}</div><div class="lbl">🟢 低风险</div></div>
                <div class="stat unread"><div class="num">${summary.unread || 0}</div><div class="lbl">📩 未读</div></div>
            </div>`;
    };

    window.viewRiskDetail = async id => {
        const list = await api('/admin/risk/scores');
        const r = list.find(x => x.id === id);
        if (!r) return toast('记录不存在', true);
        const signals = (r.signals || []).map(s => `
            <li>
                <span class="code">${esc(s.code)}</span>
                ${esc(s.message)}
                <span style="color:var(--muted-foreground);font-size:11px;margin-left:6px">权重 ${s.weight}</span>
            </li>`).join('') || '<li style="background:var(--success-50);border-left-color:var(--success-500);color:var(--success-700)">✓ 未命中任何规则信号（建议依赖 LLM 判断）</li>';
        const llm = r.llmSummary ? `
            <div class="llm-box">
                <b>🤖 AI 综合判断</b>（动作：${esc(r.llmAction || '-')}）<br>
                ${esc(r.llmSummary)}
            </div>` : '';
        const body = `
            <div class="risk-detail">
                <div class="row"><span class="lbl">订单编号</span><span>${esc(r.orderNo || ('#' + r.orderId))}</span></div>
                <div class="row"><span class="lbl">风险评分</span>
                    <span><b style="font-size:18px;color:${r.level === 'HIGH' ? 'var(--destructive)' : r.level === 'MEDIUM' ? 'var(--warning-strong)' : 'var(--success-500)'}">${r.score}</b> / 100
                        ${riskBadgeOf(r.level)}
                    </span>
                </div>
                <div class="row"><span class="lbl">建议处置</span><span><b>${esc(r.suggestedAction)}</b></span></div>
                <div class="row"><span class="lbl">评分来源</span><span>${r.source}</span></div>
                <div class="row"><span class="lbl">规则引擎分</span><span>${r.ruleScore || 0}</span></div>
                <div>
                    <div class="lbl" style="margin-bottom:8px">命中规则</div>
                    <ul class="signal-list">${signals}</ul>
                </div>
                ${llm}
            </div>`;
        openModal('风险评分详情', body, r.isRead ? null : async () => {
            try { await api('/admin/risk/scores/' + id + '/read', 'PUT'); } catch (e) {}
            closeModal();
            const rows = document.querySelectorAll('#rRows tr');
            rows.forEach(tr => {
                if (tr.innerHTML.includes('onclick="viewRiskDetail(' + id + ')"')) {
                    tr.style.background = '';
                    tr.querySelectorAll('span').forEach(s => { if (s.textContent === '●') s.remove(); });
                }
            });
            refreshRiskUnread();
        }, r.isRead, r.isRead ? '关闭' : '标为已读并关闭', '关闭');
    };

    window.markRiskRead = async id => {
        await api('/admin/risk/scores/' + id + '/read', 'PUT');
        toast('已标记为已读');
        const v = document.getElementById('rLevel').value;
        all = await api('/admin/risk/scores' + (v !== 'ALL' ? '?level=' + v : ''));
        draw(all);
        renderRisk._refreshOverview();
        refreshRiskUnread();
    };
}
