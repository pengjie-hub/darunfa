# =====================================================================
# AI 能力配置（LangChain4j + DeepSeek OpenAI 兼容端点）
# ---------------------------------------------------------------------
# DeepSeek 对外提供 OpenAI 兼容的 Chat Completions 协议：
#   完整地址 = ${deepseek.base-url}/chat/completions
# 因此这里只需要 base-url，路径由 LangChain4j 自行拼接。
#
# 关于环境变量：不必写 ${ENV:default} 占位符 —— Spring Boot 的环境变量
# 优先级本就高于 application.properties，设置 DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL /
# DEEPSEEK_MODEL 即可自动覆盖下面三项（下划线会自动映射为点/横线）。
# 反过来，若把环境变量设成空串，${ENV:default} 会解析成空值而不是默认值，反而更脆。
# =====================================================================
deepseek.base-url=https://api.deepseek.com/v1
deepseek.api-key=REDACTED_REVOKED_KEY
#
# 模型名以 GET ${deepseek.base-url}/models 的返回为准，大小写敏感（实测只有下面两个）：
#   deepseek-flash    = DeepSeek-V4.1-Flash，支持文本 + 图片
#   deepseek-v4-pro   = DeepSeek-V4-Pro，仅文本
# 两个模型都是 1M 上下文、默认开启 thinking 模式，因此换模型不会改变「工具调用需要回传
# reasoning_content」这条约束 —— 由 ai/memory/JpaBackedChatMemory 负责保住完整消息序列。
deepseek.model=deepseek-flash

# 模型参数：两档温度，同一模型实例化两个 ChatModel Bean
#   - aiChatModel        严谨档（默认 0.3）：小运问答 / 评论分析 / 评论总结 / 风控评分，要求输出可解析、少发散
#   - aiChattyChatModel  口语档（默认 0.6）：小发购物助手 / AI 在线客服，要求自然亲切
deepseek.temperature=0.3
deepseek.chatty-temperature=0.6
# 最大输出 token。原为 1024，实测「营销文案」DETAIL（≤300 字中文正文 + 3~6 卖点 + JSON 结构，且模型默认开 thinking）
# 会间歇性撞上限，模型输出在字段中间被截断 → 解析不到 body → 502。故上调到 3072 留足余量
# （仅抬高「可输出的上限」，模型正常 STOP 时不会变长；对严谨档/口语档均无副作用）。
deepseek.max-tokens=3072
deepseek.timeout-seconds=60
deepseek.max-retries=1
deepseek.log-requests=false
deepseek.log-responses=false

# AI 会话记忆参数
#   max-messages          注入模型的滑动窗口（按「条」计，10 条 ≈ 5 轮问答）
#   max-content-chars     单条历史注入前的截断长度，防止 prompt 膨胀
#   long-term-*           长期记忆（ai_memories）注入 system 提示的上限
ai.memory.max-messages=10
ai.memory.max-content-chars=500
ai.memory.long-term-max-items=20
ai.memory.long-term-max-value-chars=300

# AI 向量检索（RAG）参数
#   enabled               总开关：关掉则知识库为空、检索恒返回 0 条，助手退化为「纯记忆 + 工具调用」
#                         （注意只影响是否播种知识库，不影响 Bean 装配，见 RagConfig 说明）
#   top-k                 每次检索最终注入的知识片段数
#   min-score             相似度下限 —— 全量/后台检索用（小运、管理页「全量」）
#   min-score-customer    相似度下限 —— 顾客侧检索用（小发、AI 客服）
#   chunk-size            片段切分粒度（字符）
#   chunk-overlap         相邻片段重叠长度，避免一条规则被切断
#   hybrid-enabled        词面加权（P3）总开关；false 即完全退化为纯向量检索（用于 A/B 对照）
#   hybrid-candidate-k    加权前的候选条数（先取这么多条候选再重排、过滤、截尾）
#   hybrid-title-boost    问句实词在「小节标题」里的覆盖度对应的加项上限
#   hybrid-body-boost     问句实词在「小节正文」里的覆盖度对应的加项上限（默认 0，理由见下）
#
# ⚠️ 两个 min-score 都必须实测校准，不能凭感觉写，也不能互相照搬 ——
#    顾客侧候选池里没有后台小节，分数分布与全量池不同。
#
# 2026-10-09 实测（BGE-small-zh-v1.5，20 个问句 × 3 个域，走真实的 /api/admin/ai/knowledge/search）：
#   [分域前 · 全量池]  正例最高分 0.769~0.900（最低：怎么转人工？）
#                      负例最高分 0.636~0.777（最高：今天天气怎么样）
#                      → 正例最低 < 负例最高，分数带【交错】，不存在能同时兼顾两者的单一阈值。
#                        根因不是阈值选错，而是候选池混装：23 小节里有 6 条后台规则，
#                        三个助手却共用同一个检索器。
#   [分域后 · 顾客池]  正例 0.780~0.935，负例 0.632~0.724 → 空隙 +0.056，取中点 0.75
#                      （今天天气怎么样 从 0.777 掉到 0.689 —— 它的高分本就来自
#                        「按天统计的时间范围怎么算」这条后台小节）
#   [分域后 · 全量池]  业务口径类问句 ≥ 0.802，闲聊最高 0.777 → 空隙 +0.025，取中点 0.79
#
# hybrid-body-boost 为什么默认 0：实测给正文也加权时，「今天天气怎么样」因为命中
#   「按天统计…」正文里的「今天」而 +0.007（0.777 → 0.784），恰好越过全量池门槛。
#   同一机制既奖励「生鲜」命中退货规则正文，也奖励「今天」命中统计口径正文 ——
#   加性权重无法区分「正文确实在讲这件事」与「正文只是顺带提了一句」。
#   只按标题加权时：正例下限 0.769 → 0.780（怎么转人工 0.769 → 0.819），负例一条未动。
ai.rag.enabled=true
ai.rag.top-k=3
ai.rag.min-score=0.79
ai.rag.min-score-customer=0.75
ai.rag.chunk-size=400
ai.rag.chunk-overlap=60
ai.rag.hybrid-enabled=true
ai.rag.hybrid-candidate-k=10
ai.rag.hybrid-title-boost=0.05
ai.rag.hybrid-body-boost=0.0
