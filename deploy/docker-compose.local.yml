# =====================================================================
# 大润发电商系统 —— 2核2G 机器专用编排
#
# 与 docker-compose.yml 的区别只有一处：
#   app 不再从源码构建（不跑 Node/Maven），镜像里也不含 jar，
#   jar 由 scripts/local-release.sh 在本地生成并上传到 deploy/dist/，
#   运行时通过 ./dist:/app/dist:ro 挂载进容器。
#
# 启动：cd /opt/darunfa/deploy && docker compose -f docker-compose.local.yml up -d --force-recreate app
# jar 通过 ./dist:/app/dist:ro 挂载进容器，换版本只需重启容器，不重建镜像。
# 通常不用手敲，本地执行 bash deploy/scripts/local-release.sh root@服务器IP 即可
# =====================================================================

name: darunfa

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 2核2G 专用：buffer pool 压到 192M，关掉 performance_schema 省 100M+
      - --innodb-buffer-pool-size=192M
      - --performance-schema=OFF
      - --max-connections=50
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: darunfa
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时按文件名顺序自动执行这里的 .sql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - darunfa

  app:
    # 直接用官方 JRE 镜像，不再自建。
    #
    # 为什么放弃自建镜像：这台机器只有 2G，buildkit 反复在构建阶段被 OOM，
    # 报过两种错 ——
    #   load build context: context deadline exceeded
    #   load local bake definitions -> NotFound: forwarding Ping: no such job
    # 而原来 Dockerfile.runtime 相对基础镜像只多了三样东西：非 root 用户、
    # 时区、JAVA_OPTS。这三样下面全部能用 compose 声明，没必要为此付出
    # 一整套构建流程的代价。应用本身不写任何文件（无上传、日志走 stdout），
    # 所以容器内不需要可写目录。
    image: eclipse-temurin:17-jre-jammy
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 只绑回环地址：外网必须经过宿主机 Nginx
      - "127.0.0.1:8080:8080"
    volumes:
      # jar 用目录挂载（不是单文件挂载）：单文件挂载在文件缺失时 Docker 会自动
      # 建成一个同名目录，java 启动会报 "Error: Unable to access jarfile"，
      # 而目录挂载只会得到一个空目录，排查起来更直观。
      # 换版本 = 覆盖 deploy/dist/app.jar + 重启容器，不涉及任何构建。
      - ./dist:/app/dist:ro
    working_dir: /app
    # 非 root 运行（等价于原 Dockerfile 里的 app 用户）。因为这个 uid 只读取
    # /app/dist 下的 jar，不写盘，所以不需要额外的属主处理。
    user: "10001:10001"
    # $$ 是 compose 的转义写法，实际传给 sh -c 的是 $JAVA_OPTS。
    # exec 让 java 成为 PID 1，能收到 SIGTERM 优雅停机。
    entrypoint: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/dist/app.jar"]
    environment:
      TZ: Asia/Shanghai
      # --- 2G 内存上限：堆 640M 给应用，其余留给元空间/线程栈/堆外 ---
      JAVA_OPTS: "-Xms128m -Xmx640m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8"
      # --- 数据源：覆盖 application.properties 里的 localhost/root/123456 ---
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/darunfa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # --- 鉴权：必须换成随机串，否则任何人都能伪造 JWT ---
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 中设置 JWT_SECRET}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 deploy/.env 中设置 ADMIN_PASSWORD}
      # --- AI：key 只走环境变量，缺了就在这里报错，不等到运行期 401 ---
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 deploy/.env 中设置 DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - darunfa

volumes:
  mysql-data:

networks:
  darunfa:
    driver: bridge
