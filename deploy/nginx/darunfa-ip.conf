# =====================================================================
# 大润发电商系统 —— Nginx 站点配置【无域名版：直接用 IP 访问】
#
# 适用：不买域名，访问地址为 http://服务器公网IP/app/
# 与 darunfa.conf 的区别：
#   - server_name 用 _ 兜底，不校验 Host
#   - listen 加 default_server，作为 80 端口的默认站点
#   - 没有 443 / 证书部分（Let's Encrypt 必须校验域名，纯 IP 签不了）
#
# 放置位置：/etc/nginx/sites-available/darunfa.conf
# 启用：
#   ln -sf /etc/nginx/sites-available/darunfa.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default      # 必须删，否则 default_server 冲突
#   nginx -t && systemctl reload nginx
#
# 以后想换域名时：把本文件换回 darunfa.conf（有域名 + HTTPS 版），再跑 certbot 即可，
# 应用和数据库都不用动。
# =====================================================================

# AI 公开接口限流：每 IP 每分钟 10 次，burst 5
limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    access_log /var/log/nginx/darunfa.access.log;
    error_log  /var/log/nginx/darunfa.error.log;

    # 根路径直接进 Vue 后台，省得访客还要记 /app/
    location = / {
        return 302 /app/;
    }

    # AI 公开接口：限流 + 文件开关（/etc/nginx/darunfa-ai.inc）
    # 关闭访问：sudo bash deploy/scripts/toggle-ai.sh off
    location ~ ^/api/(chat|ai) {
        include /etc/nginx/darunfa-ai.inc;
        limit_req zone=ai burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 接口后端超时 60s，Axios 90s；Nginx 必须留更长余量
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        proxy_buffering off;
    }

    # 静态资源仍在 Spring Boot jar 内，由 Nginx 反代返回并下发长缓存头
    location ~* ^/app/assets/.*\.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
