# =====================================================================
# 大润发电商系统 —— Nginx 站点配置（宿主机）
# 放置位置：/etc/nginx/sites-available/darunfa.conf
# 启用：ln -s /etc/nginx/sites-available/darunfa.conf /etc/nginx/sites-enabled/
#
# 先把下面所有 your-domain.com 换成你的真实域名，再执行：
#   nginx -t && systemctl reload nginx
# 然后签证书：
#   certbot --nginx -d your-domain.com
# certbot 会自动改写本文件，追加 443 的 server 块与跳转。
# =====================================================================

# AI 公开接口限流：每 IP 每分钟 10 次，burst 5
limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/m;

# ---------- HTTP：先能通，再交给 certbot 上 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 上传商品图等留点余量
    client_max_body_size 20m;

    # 访问日志单独放，方便排查
    access_log /var/log/nginx/darunfa.access.log;
    error_log  /var/log/nginx/darunfa.error.log;

    # 根路径直接进 Vue 后台（比 Spring 默认跳 login.html 更像成品）
    location = / {
        return 302 /app/;
    }

    # AI 公开接口：限流 + 文件开关（/etc/nginx/darunfa-ai.inc）
    # 关闭访问：sudo bash deploy/scripts/toggle-ai.sh off
    location ~ ^/api/(chat|ai) {
        include /etc/nginx/darunfa-ai.inc;
        limit_req zone=ai burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 接口后端超时 60s，Axios 90s；Nginx 必须留更长的余量
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # 不缓冲，避免 AI 长响应被 Nginx 攒着一次性吐
        proxy_buffering off;
    }

    # 静态资源仍在 Spring Boot jar 内，由 Nginx 反代返回并下发长缓存头
    location ~* ^/app/assets/.*\.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip：admin.html 有 170KB，压完剩不到 30KB
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
